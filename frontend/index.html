          : `Einschalten startet wirklich einen Rechenknoten auf diesem Gerät.
             Er hält dann Schichten eines fremden Modells und ist dafür die
             ganze Sitzung gebunden. Beim Verlassen des Netzes endet er mit.`}
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="vtModell" style="flex:1;min-width:200px"
               placeholder="Modell, z. B. llama3:70b" value="${esc(state.vtModell||"")}">
        <button class="btn btn-ghost" onclick="meshVerteiltPlan()">Plan rechnen</button>
      </div>
      <div id="vtPlan" style="margin-top:12px">${meshPlanHtml(state.vtPlan)}</div>
      <div id="vtLauf" style="margin-top:10px">${meshVerteiltLaufHtml(m.verteilt)}</div>
    </div>

    <div class="mesh-kachel">
      <h3 style="margin-bottom:6px">Vertrauen — wer rechnet wirklich?</h3>
      <p style="color:var(--text-2);font-size:13.5px;margin-bottom:10px">
        Eine Modellantwort lässt sich nicht nachprüfen — zwei ehrliche Geräte
        antworten verschieden. Prüfbar ist etwas Kleineres: <b>ob überhaupt
        gerechnet wurde.</b> Der billige Betrug ist nicht das falsche Ergebnis,
        sondern gar keins.
      </p>
      ${(m.vertrauen||[]).length ? `
        ${(m.vertrauen||[]).map(v => `
          <div class="mesh-geraet" style="align-items:flex-start">
            <span>${v.urteil==="unzuverlässig"?"⛔":v.urteil==="auffällig"?"⚠️":v.urteil==="verlässlich"?"✅":"·"}</span>
            <span class="g-id" style="flex:1">
              ${esc(v.knoten)}
              <div style="color:var(--text-3);font-size:12.5px;margin-top:2px">
                ${esc(v.begruendung)}
                ${v.formattreue && v.formattreue!=="nicht geprüft"
                  ? ` · Formattreue ${esc(v.formattreue)} <i>(zählt nicht ins Urteil)</i>` : ""}
              </div>
            </span>
            <span class="g-gb">${v.auftraege} Antwort(en)</span>
          </div>`).join("")}
        <p style="color:var(--text-3);font-size:12.5px;margin-top:10px">
          Wer wiederholt beanstandet wurde, bekommt keine Aufträge mehr. Ein
          einzelner Aussetzer sperrt niemanden — ein fälschlich ausgesperrter
          ehrlicher Knoten ist teurer als ein durchgerutschter Betrüger.
        </p>`
        : `<p style="color:var(--text-2);font-size:13.5px">Noch keine fremden
             Antworten bewertet. Sobald Aufträge an andere Geräte gehen, steht
             hier, was sie geliefert haben.</p>`}
      ${m.gebremst ? `<p style="color:var(--text-3);font-size:12.5px;margin-top:8px">
        🛡 ${m.gebremst} Antwort(en) verweigert, weil zu viele Fragen von
        derselben Adresse kamen — Schutz gegen Verstärkungsangriffe.</p>` : ""}
    </div>

    <div class="mesh-kachel">
      <h3 style="margin-bottom:8px">Einladen und beitreten</h3>
      <p style="color:var(--text-2);font-size:13.5px;margin-bottom:10px">
        ${m.betriebsart==="klause"
          ? "In deinem Netz finden sich Geräte von allein. Ein Ticket brauchst du nur für jemanden <b>außerhalb</b> deines Netzes."
          : "In der Weite gibt es keinen Rundruf. Ein Ticket ist der Türöffner — und <b>ein einziges genügt</b>: Danach lernt der Neue vom ersten Kontakt aus das ganze Netz kennen."}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="meshTicketNeu()">🎟 Ticket erzeugen</button>
        <button class="btn btn-ghost" onclick="meshTicketEin()">＋ Ticket einlösen</button>
      </div>
    </div>

    <div class="mesh-kachel">
      <h3 style="margin-bottom:8px">Dein Beitrag</h3>
      <div class="cu-check">
        ${cuRow("Abgegeben", (m.beitrag||{}).erlaubt_gb>0, ((m.beitrag||{}).erlaubt_gb||0)+" GB")}
        ${cuRow("Kryptostufe", m.krypto.konstantzeitig, esc(m.krypto.backend))}
        ${cuRow("Nachrichten empfangen", (m.briefe||0)>0, (m.briefe||0)+"")}
      </div>
      <p style="color:var(--text-3);font-size:12.5px">${esc((m.beitrag||{}).begruendung||"")}</p>
    </div></div>`;
  meshTakt = setInterval(() => { if (state.view==="mesh") renderMesh(); }, 6000);
}

async function meshAutostart(art) {
  try {
    const r = await apiPost("/api/mesh/autostart", {art: art});
    if (r.fehler) return toast(r.fehler);
    toast(art ? "Wird beim Start mitgestartet" : "Startet künftig nicht mit");
  } catch(e) { toast(e.message); }
}

async function meshTicketNeu() {
  let r = {};
  try { r = await apiPost("/api/mesh/ticket-neu", {}); }
  catch(e) { return toast(e.message); }
  if (r.fehler) return toast(r.fehler);
  openModal("Einladungsticket", `
    <p style="color:var(--text-2)">Gib das hier weiter. Wer es hat, <b>darf mitreden</b> — aber nichts mitlesen: Nachrichten sind davon unabhängig Ende-zu-Ende verschlüsselt.</p>
    <p style="color:var(--red);font-size:13px">Ein Ticket ist <b>kein</b> Kontaktanker. Ein Ticket wird weitergegeben, ein Anker niemals.</p>
    ${r.qr ? `<div class="qr-feld">${r.qr}</div>
      <p style="color:var(--text-3);font-size:12.5px;text-align:center">Abfotografieren — oder den Text darunter kopieren.</p>` : ""}
    <div class="anker-code" style="font-size:11px;letter-spacing:0;text-align:left;word-break:break-all">${esc(r.ticket||"")}</div>
    <p style="color:var(--text-3);font-size:12.5px">${esc(r.hinweis||"")}<br>
      Erkannte Adressen: ${esc((r.adressen||[]).join(", ")||"keine")}</p>`,
    [{label:"Schließen", action:closeModal}]);
}

function meshTicketEin() {
  openModal("Ticket einlösen", `
    <p style="color:var(--text-2)">Füge das Ticket ein, das du bekommen hast. Zeilenumbrüche und Leerzeichen sind kein Problem.</p>
    <div class="field"><label>Ticket</label>
      <textarea id="tk-text" rows="5" placeholder="DOWOS1.…" style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px"></textarea></div>`,
    [{label:"Abbrechen", action:closeModal},
     {label:"Einlösen", primary:true, action:meshTicketEinJa}]);
}

async function meshTicketEinJa() {
  const t = $("#tk-text").value;
  try {
    const r = await apiPost("/api/mesh/ticket-ein", {ticket: t});
    if (r.fehler) return toast(r.fehler);
    closeModal();
    toast("Kontakt zu " + (r.knoten_id||"").slice(0,10) + " aufgenommen 🎟");
    setTimeout(renderMesh, 1500);
  } catch(e) { toast(e.message); }
}

async function meshStart(art) {
  const feld = $("#mesh-gb");
  const gb = feld && feld.value ? Number(feld.value) : null;
  try {
    const r = await apiPost("/api/mesh/start", {betriebsart: art, abgeben_gb: gb});
    if (r.fehler) return toast("Start fehlgeschlagen: " + r.fehler);
    toast(art === "klause" ? "Diving Net gestartet 🤿" : "Weite gestartet 🌍");
    renderMesh();
    // Die Modelle der anderen Geraete kommen erst, wenn sie gefunden sind.
    modelleNeuLaden(); setTimeout(modelleNeuLaden, 10000);
  } catch(e) { toast("Start fehlgeschlagen: " + e.message); }
}

async function meshStop() {
  clearInterval(meshTakt);
  try { await apiPost("/api/mesh/stop", {}); toast("Netzwerk verlassen — Schlüssel vernichtet"); }
  catch(e) { toast("Fehler: " + e.message); }
  renderMesh();
  modelleNeuLaden();
}

/* =====================================================================
   BOTE — verschlüsselter Messenger über das Mesh
   ===================================================================== */
let boteTakt = null;
let boteAktiv = null;
let boteUmwege = false;

async function renderBote() {
  clearInterval(boteTakt);
  let d = {};
  try { d = await api("/api/mesh/kontakte"); } catch(e) { d = {laeuft:false}; }

  if (!d.laeuft) {
    $("#view").innerHTML = `<div class="view-pad">
      <div class="view-head"><div class="vh-ico">✉️</div>
        <div><h1>Bote</h1><p>Verschlüsselte Nachrichten direkt von Gerät zu Gerät — ohne Server, ohne Konto, ohne Telefonnummer.</p></div></div>
      <div class="empty-state"><div class="big">🕸</div>
        <h3>Das Netzwerk läuft noch nicht</h3>
        <p>Der Bote braucht das Mesh. Starte es unter <b>Netzwerk</b>.</p>
        <button class="btn btn-primary" style="margin-top:14px" onclick="show('mesh')">Zum Netzwerk</button>
      </div></div>`;
    return;
  }

  const ks = d.kontakte || [];
  if (boteAktiv && !ks.some(k => k.name === boteAktiv)) boteAktiv = null;
  /* Bei EINEM Kontakt ist „Wähle einen Kontakt" eine Frage ohne Wahl. Dann
     gleich öffnen — der Bote soll dort aufmachen, wo man ohnehin hin will.
     Bei mehreren bleibt die Liste, denn dann ist es wirklich eine Wahl. */
  if (!boteAktiv && ks.length === 1) boteAktiv = ks[0].name;
  let verlauf = [];
  let aktiv = ks.find(k => k.name === boteAktiv) || null;
  if (aktiv) {
    try { verlauf = (await api("/api/mesh/chat?name=" + encodeURIComponent(aktiv.name))).verlauf || []; }
    catch(e) { verlauf = []; }
  }

  $("#view").innerHTML = `<div class="view-pad">
    <div class="view-head"><div class="vh-ico">✉️</div>
      <div><h1>Bote</h1><p>Nachrichten leben <b>nur im Arbeitsspeicher</b>. Beim Beenden von Dive on Wide sind sie weg — auch die Kontakte.</p></div>
      <div class="vh-actions"><button class="btn btn-primary" onclick="boteAnkerZeigen()">＋ Kontakt</button></div></div>

    <div class="bote">
      <div class="bote-liste">
        ${ks.length ? ks.map(k => `
          <button class="bote-k ${k.online?"on":""} ${k.name===boteAktiv?"aktiv":""}"
                  onclick="boteOeffnen('${jsarg(k.name)}')">
            <span class="punkt"></span>
            <span class="n">${esc(k.name)}${k.bestaetigt?" ✓":""}</span>
            <span class="z">${k.online ? "da" : "weg"}${k.nachrichten?" · "+k.nachrichten:""}</span>
          </button>`).join("")
        : `<p style="color:var(--text-2);font-size:13.5px">Noch keine Kontakte. Ein Anker wird <b>persönlich</b> getauscht — vorgelesen oder abgetippt, nie über einen anderen Messenger.</p>`}
      </div>

      <div class="bote-raum">
        ${aktiv ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
            <b style="font-size:16px">${esc(aktiv.name)}</b>
            <span class="badge ${aktiv.online?"badge-green":"badge-gray"}">${aktiv.online?"● erreichbar":"○ nicht da"}</span>
            <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="boteZahl()">🔑 Sicherheitszahl</button>
            <button class="btn btn-danger btn-sm" onclick="boteLoeschen()">✕ Auslöschen</button>
          </div>
          ${(!aktiv.online && !aktiv.nachrichten) ? `<div class="warn-box" style="margin:10px 0">
            <b>Noch nicht erkannt.</b> Beide Geräte müssen <b>denselben</b> Anker
            eingetragen haben — er wird geteilt, nicht getauscht. Wer einen eigenen
            erzeugt und dem anderen dessen eigenen einträgt, wartet ewig.
            <div style="margin-top:6px;opacity:.85">
              Auch zu prüfen: Läuft Dive on Wide drüben, und ist das Netzwerk dort
              gestartet? Sind beide in derselben Betriebsart — Diving Net und Weite
              mischen sich nie?
              <br>Vertippt? Trag den Anker unter <b>demselben Namen</b> einfach
              nochmal ein; solange ihr noch nicht verbunden seid, wird er berichtigt.
            </div>
          </div>` : ""}
          <div class="bote-verlauf" id="bote-verlauf">
            ${verlauf.length ? verlauf.map(n => `
              <div class="blase ${n.richtung==="aus"?"aus":"ein"}">${esc(n.text)}
                <span class="t">${new Date(n.zeit*1000).toLocaleTimeString()}${n.umwege?" · über "+n.umwege+" Umweg(e)":""}</span></div>`).join("")
            : `<p style="color:var(--text-3);text-align:center;padding:30px 0">Noch nichts gesagt.</p>`}
          </div>
          <div class="bote-eingabe">
            <input id="bote-text" placeholder="${aktiv.online?"Nachricht schreiben…":"Wartet, bis "+esc(aktiv.name)+" erreichbar ist"}"
                   onkeydown="if(event.key==='Enter')boteSenden()" ${aktiv.online?"":"disabled"}>
            <button class="btn btn-primary" onclick="boteSenden()" ${aktiv.online?"":"disabled"}>Senden</button>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:9px;
                        font-size:12.5px;color:var(--text-2)">
            <input type="checkbox" id="bote-umwege" ${boteUmwege?"checked":""}
                   onchange="boteUmwege=this.checked" ${(d.umwege_moeglich||0)>0?"":"disabled"}>
            Über Umwege senden
            ${(d.umwege_moeglich||0)>0
              ? `<span style="color:var(--text-3)">— ${d.umwege_moeglich} Zwischenknoten verfügbar. Dann sieht auch kein Nachbar mehr, <b>dass</b> ihr miteinander sprecht.</span>`
              : `<span style="color:var(--text-3)">— nicht möglich: dafür braucht es mindestens ein Gerät neben euch beiden.</span>`}
          </label>
          ${aktiv.sicherheitszahl && !aktiv.bestaetigt ? `<p style="color:var(--amber-ink);font-size:12.5px;margin-top:8px">⚠️ Noch nicht bestätigt. Vergleicht die Sicherheitszahl einmal persönlich — sonst könnte sich jemand dazwischengeschoben haben.</p>` : ""}
        ` : `<div class="empty-state"><div class="big">✉️</div>
              <h3>Wähle einen Kontakt</h3>
              <p>Oder lege einen neuen an — ihr braucht dafür einen gemeinsamen Anker.</p></div>`}
      </div>
    </div></div>`;

  const v = $("#bote-verlauf");
  if (v) v.scrollTop = v.scrollHeight;
  const e = $("#bote-text");
  if (e && !e.disabled) e.focus();
  boteTakt = setInterval(() => { if (state.view === "bote") renderBote(); }, 4000);
}

function boteOeffnen(name) { boteAktiv = name; renderBote(); }

async function boteAnkerZeigen() {
  let neu = "";
  try { neu = (await apiPost("/api/mesh/anker", {})).anker || ""; } catch(e) {}
  openModal("Kontakt anlegen", `
    <p style="color:var(--text-2);margin-bottom:6px">Ein <b>Anker</b> ist ein Geheimnis zwischen genau euch beiden. Beide Geräte tragen denselben ein — danach findet ihr euch immer wieder, ohne dass ein Dritter erkennen kann, wer sich da trifft.</p>
    <p style="color:var(--red);font-size:13px"><b>Persönlich austauschen.</b> Vorlesen, abtippen, zeigen. Niemals über einen anderen Messenger schicken — wer ihn unterwegs abfängt, ist drin.</p>
    <div style="border-top:1px solid var(--border-soft);margin:14px 0;padding-top:12px">
      <label style="font-weight:600">Neuer Anker — <u>beide</u> tragen genau diesen ein</label>
      <div class="anker-code">${esc(neu)}</div>
    </div>
    <div class="field"><label>Name (nur für dich, wird nie gesendet)</label>
      <input id="ank-name" placeholder="z. B. Anna"></div>
    <div class="field"><label>Anker — entweder der neue von oben (dann sag ihn dem anderen), oder der, den du bekommen hast. <b>Nie beide tauschen.</b></label>
      <input id="ank-code" value="${esc(neu)}" style="font-family:ui-monospace,Menlo,monospace"></div>`,
    [{label:"Abbrechen", action:closeModal},
     {label:"Anlegen", primary:true, action:boteKontaktAnlegen}]);
}

async function boteKontaktAnlegen() {
  const name = $("#ank-name").value.trim();
  const code = $("#ank-code").value.trim();
  try {
    const r = await apiPost("/api/mesh/kontakt", {name: name, anker: code});
    if (r.fehler) return toast(r.fehler);
    closeModal(); boteAktiv = name; toast("Kontakt angelegt ✉️"); renderBote();
  } catch(e) { toast(e.message); }
}

async function boteSenden() {
  const feld = $("#bote-text");
  if (!feld || !feld.value.trim() || !boteAktiv) return;
  const text = feld.value;
  feld.value = "";
  try {
    const r = await apiPost("/api/mesh/senden",
                        {name: boteAktiv, text: text, umwege: boteUmwege ? 2 : 0});
    if (r.fehler) { toast(r.fehler); feld.value = text; return; }
  } catch(e) { toast(e.message); feld.value = text; return; }
  renderBote();
}

async function boteZahl() {
  let ks = [];
  try { ks = (await api("/api/mesh/kontakte")).kontakte || []; } catch(e) {}
  const k = ks.find(x => x.name === boteAktiv);
  if (!k) return;
  openModal("Sicherheitszahl — " + esc(k.name), `
    <p style="color:var(--text-2)">Ende-zu-Ende-Verschlüsselung schützt die Leitung. Sie sagt aber <b>nicht</b>, wer am anderen Ende sitzt. Lest diese Zahl einmal persönlich oder am Telefon vor. Stimmt sie überein, hört niemand mit.</p>
    <div class="anker-code sz-zahl">${esc(k.sicherheitszahl || "— noch nicht erreichbar —")}</div>
    ${k.bestaetigt ? `<p style="color:var(--green)">✓ Bereits bestätigt.</p>` : ""}`,
    (k.sicherheitszahl && !k.bestaetigt)
      ? [{label:"Später", action:closeModal},
         {label:"Stimmt überein", primary:true, action:boteZahlOk}]
      : [{label:"Schließen", action:closeModal}]);
}

async function boteZahlOk() {
  try { await apiPost("/api/mesh/kontakt-ok", {name: boteAktiv}); } catch(e) {}
  closeModal(); toast("Bestätigt ✓"); renderBote();
}

async function boteLoeschen() {
  if (!boteAktiv) return;
  openModal("Auslöschen?", `
    <p>Der Verlauf mit <b>${esc(boteAktiv)}</b> wird im Arbeitsspeicher überschrieben und der Anker vernichtet. Danach existiert die Verbindung nicht einmal mehr als Adresse.</p>
    <p style="color:var(--text-2);font-size:13px">Um euch wieder zu erreichen, braucht ihr einen neuen Anker — persönlich getauscht.</p>`,
    [{label:"Abbrechen", action:closeModal},
     {label:"Endgültig auslöschen", primary:true, action:boteLoeschenJa}]);
}

async function boteLoeschenJa() {
  try { await apiPost("/api/mesh/kontakt-weg", {name: boteAktiv}); } catch(e) {}
  boteAktiv = null; closeModal(); toast("Ausgelöscht — nichts blieb übrig"); renderBote();
}

/* =====================================================================
   FORUM — Themen, die von selbst wieder verschwinden
   ===================================================================== */
let forumTakt = null;
let forumFaden = null;

function restzeit(ablauf) {
  const s = Math.max(0, ablauf - Date.now()/1000);
  if (s < 60) return {t: Math.round(s) + " s", knapp: true};
  if (s < 3600) return {t: Math.round(s/60) + " Min", knapp: s < 600};
  return {t: Math.round(s/3600) + " Std", knapp: false};
}

async function renderForum() {
  clearInterval(forumTakt);
  let d = {};
  try { d = await api("/api/mesh/faeden"); } catch(e) { d = {laeuft:false}; }

  if (!d.laeuft) {
    $("#view").innerHTML = `<div class="view-pad">
      <div class="view-head"><div class="vh-ico">🗣</div>
        <div><h1>Forum</h1><p>Themen, die niemand betreibt und die von selbst wieder verschwinden.</p></div></div>
      <div class="empty-state"><div class="big">🕸</div>
        <h3>Das Netzwerk läuft noch nicht</h3>
        <p>Das Forum lebt im Mesh. Starte es unter <b>Netzwerk</b>.</p>
        <button class="btn btn-primary" style="margin-top:14px" onclick="show('mesh')">Zum Netzwerk</button>
      </div></div>`;
    return;
  }

  if (forumFaden) return renderForumFaden();

  const fs = d.faeden || [];
  $("#view").innerHTML = `<div class="view-pad">
    <div class="view-head"><div class="vh-ico">🗣</div>
      <div><h1>Forum</h1><p>Kein Betreiber, keine Konten. Für jeden Faden bekommst du ein <b>eigenes Pseudonym</b> — zwei Beiträge von dir in zwei Fäden sind nicht als derselbe Mensch erkennbar.</p></div>
      <div class="vh-actions"><button class="btn btn-primary" onclick="forumNeu()">＋ Faden</button></div></div>

    ${fs.length ? fs.map(f => {
      const r = restzeit(f.laeuft_ab);
      return `<div class="faden ${f.geschlossen?"zu":""}" onclick="forumOeffnen('${jsarg(f.id)}')">
        <h4>${f.geschlossen?"🔒 ":""}${esc(f.titel)}</h4>
        <div class="meta">
          <span>${f.antworten} Antwort(en)</span>
          <span class="rest ${r.knapp?"knapp":""}">verschwindet in ${r.t}</span>
          <span>von ${esc(f.verfasser)}</span>
        </div></div>`;}).join("")
    : `<div class="empty-state"><div class="big">🗣</div>
        <h3>Noch keine Fäden</h3>
        <p>Eröffne einen — er lebt so lange, wie du festlegst, und ist danach weg.</p></div>`}

    <div class="warn-box" style="margin-top:16px">
      <b>Was hier ehrlich gesagt werden muss:</b> Beiträge sind im Netz <b>lesbar</b> — wer verschlüsselt schreiben will, nimmt den Boten.
      Und „geschlossen" ist eine <b>Bitte</b>, keine Garantie: Niemand kann fremden Arbeitsspeicher zwingen.
      Verlässlich ist nur die <b>Verfallszeit</b> — danach hat kein ehrlicher Knoten den Inhalt mehr.
    </div></div>`;
  forumTakt = setInterval(() => { if (state.view === "forum") renderForum(); }, 8000);
}

async function renderForumFaden() {
  let f = null;
  try {
    const r = await api("/api/mesh/faden?id=" + encodeURIComponent(forumFaden));
    if (r.fehler) throw new Error(r.fehler);
    f = r;
  } catch(e) { toast(e.message); forumFaden = null; return renderForum(); }

  const r = restzeit(f.laeuft_ab);
  $("#view").innerHTML = `<div class="view-pad">
    <div class="view-head"><div class="vh-ico">🗣</div>

async function forumNeuAnlegen() {
  const titel = $("#f-titel").value.trim();
  const text = $("#f-text").value;
  const std = Number($("#f-std").value) || 6;
  try {
    const r = await apiPost("/api/mesh/faden-neu", {titel: titel, text: text, stunden: std});
    if (r.fehler) return toast(r.fehler);
    closeModal(); forumFaden = r.id; toast("Faden eröffnet 🗣"); renderForumFaden();
  } catch(e) { toast(e.message); }
}

async function forumAntworten() {
  const feld = $("#forum-text");
  if (!feld || !feld.value.trim() || !forumFaden) return;
  const text = feld.value;
  feld.value = "";
  try {
    const r = await apiPost("/api/mesh/beitrag", {id: forumFaden, text: text});
    if (r.fehler) { toast(r.fehler); feld.value = text; return; }
  } catch(e) { toast(e.message); feld.value = text; return; }
  renderForumFaden();
}

function lossKurve(v) {
  const t = (v.train||[]).filter(p => p.loss != null), va = (v.val||[]).filter(p => p.loss != null);
  if (t.length < 2) return `<div style="color:var(--text-3);font-size:12.5px">Noch keine Messpunkte.</div>`;
  const alle = t.concat(va), maxI = Math.max(...alle.map(p=>p.iter)), minI = Math.min(...alle.map(p=>p.iter));
  const maxL = Math.max(...alle.map(p=>p.loss)), minL = Math.min(...alle.map(p=>p.loss));
  const B = 560, H = 120, x = i => 6 + (B-12) * (i-minI) / Math.max(1, maxI-minI),
        y = l => 6 + (H-12) * (1 - (l-minL) / Math.max(1e-9, maxL-minL));
  const linie = ps => ps.map((p,k) => (k?"L":"M") + x(p.iter).toFixed(1) + " " + y(p.loss).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${B} ${H}" style="width:100%;height:120px;background:var(--bg-2,transparent);border-radius:8px" role="img" aria-label="Loss-Verlauf">
    <path d="${linie(t)}" fill="none" stroke="var(--primary)" stroke-width="1.8"/>
    ${va.length > 1 ? `<path d="${linie(va)}" fill="none" stroke="var(--amber-ink,#b26b00)" stroke-width="1.8" stroke-dasharray="4 3"/>` : ""}
  </svg><div style="display:flex;gap:14px;font-size:12px;color:var(--text-3)"><span>— Train ${t[t.length-1].loss.toFixed(3)}</span>${va.length ? `<span>- - Val ${va[va.length-1].loss.toFixed(3)}</span>` : ""}<span style="margin-left:auto">Loss ${minL.toFixed(2)}–${maxL.toFixed(2)} · Iter ${minI}–${maxI}</span></div>`;
}

}
function destillationExport(id) {
  const los = async silber => {
    try {
      const r = await apiPost("/api/destillation/" + id + "/export", {mit_silber: silber});
      closeModal();
      const zeilen = Object.entries(r.themen).map(([t, v]) => `${t}: ${v.beispiele} Beispiele aus ${v.gewaehlt} Proben`);
      toast("⤓ " + (zeilen.join(" · ") || "keine trainierbaren Proben") + (r.gesperrt ? ` · ${r.gesperrt} Abo-Proben nicht übernommen (nur Systemtest)` : "")); renderTraining();
    } catch(e) { toast("Nicht möglich: " + e.message); }
  };
  openModal("⤓ Datensatz je Thema", `<p style="color:var(--text-2)">Aus den Proben wird je Thema ein Datensatz unter <code>storage/training/daten/</code> — mit Anteilsgrenzen je Lehrer und je Lösungsstruktur. Gescheiterte und abgebrochene Lösungen landen getrennt in <code>negativ.jsonl</code>, nie im Trainingsziel.</p>
    <p style="color:var(--text-3);font-size:12.5px">GOLD: Orakel, Robustheit und Kausalität bestanden. SILVER: nur das Orakel — für kleine Datensätze vertretbar, aber schwächer belegt.</p>`,
    [{label:"GOLD und SILVER", action: () => los(true)}, {label:"Nur GOLD", primary:true, action: () => los(false)}]);
}
function trainingEpochen() {
  const el = $("#tr-epochen"); if (!el) return;
  const d = trainingDatensaetze.find(x => x.pfad === ($("#tr-daten")||{}).value);
  const iters = +($("#tr-iters")||{}).value || 0, batch = +($("#tr-batch_size")||{}).value || 1;
  if (!d || !d.train || !iters) { el.textContent = ""; return; }
  const ep = iters * batch / d.train;
  el.innerHTML = `≈ <b>${ep.toFixed(1)} Epochen</b> über ${d.train} Beispiele.` + (ep > 1.5 ? " Mehr als etwa eine Epoche lernt bei wenigen Beispielen vor allem auswendig — lieber mehr Übungsaufgaben erzeugen." : "");
}
async function trainingStarten() {
  const werte = {};
  ["iters","lr","rank","num_layers","batch_size","grad_accum","max_seq","geduld"].forEach(k => werte[k] = $("#tr-" + k).value.trim());
  if (!confirm("Training starten? Der Rechner ist danach lange ausgelastet.")) return;
  try { await apiPost("/api/training/starten", {modell: $("#tr-modell").value, daten: $("#tr-daten").value, werte}); toast("🏋️ Training gestartet"); renderTraining(); }
  catch(e) { toast("Nicht möglich: " + e.message); }
}
function trainingDienstZeile(l) {
  if (l.zustand !== "fertig") return "";
  const d = trainingDienste.find(x => x.id === l.id);
  if (!d) return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-ghost btn-sm" onclick="trainingAktion('${jsarg(l.id)}','bereitstellen')">▶ Als Modell bereitstellen</button>
      <button class="btn btn-ghost btn-sm" onclick="trainingOllama('${jsarg(l.id)}')">⤓ In Ollama übernehmen</button>
      <span style="font-size:12px;color:var(--text-3)">Bereitstellen startet Grundmodell + Adapter auf diesem Rechner (nur 127.0.0.1), sofort und ohne Kopie. Ollama backt den Adapter ein und macht ein eigenständiges Modell daraus — auch für andere Geräte im Diving Net.</span></div>`;
  return `<div class="ok-box" style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span>${d.bereit ? "✅ Bereitgestellt als" : "⏳ Lädt …"} <b>Schüler: ${esc(d.name)}</b> · Port ${d.port}</span>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="trainingAktion('${jsarg(l.id)}','beenden')">■ Beenden</button></div>`;
}
function trainingOllama(id) {
  const vorschlag = "dowos-schueler:" + id.replace(/^training_/, "").replace(/_/g, "-");
  openModal("⤓ In Ollama übernehmen", `
    <p style="color:var(--text-2);margin-bottom:10px">Der Adapter wird ins Grundmodell eingebacken, nach GGUF umgewandelt, quantisiert und als eigenes Ollama-Modell angelegt. Braucht llama.cpp und vorübergehend etwa das Neunfache des Grundmodells an Speicherplatz; Zwischendateien werden danach entfernt, es bleibt nur die Kopie in Ollama.</p>
    <div class="field"><label>Name des Modells</label><input id="to-name" value="${esc(vorschlag)}"></div>
    <div class="field"><label>Quantisierung</label><select id="to-quant">
      <option value="Q8_0">Q8_0 — nahezu verlustfrei (empfohlen für kleine Modelle)</option>
      <option value="Q4_K_M">Q4_K_M — halb so groß, etwas ungenauer</option>
      <option value="F16">F16 — unkomprimiert</option></select></div>`,
    [{label:"Abbrechen", action: closeModal},
     {label:"Übernehmen", primary:true, action: async () => {
       try { await apiPost("/api/training/" + id + "/ollama", {name: $("#to-name").value.trim(), quant: $("#to-quant").value});
             closeModal(); toast("⤓ Übernahme läuft"); renderTraining(); }
       catch(e) { toast("Nicht möglich: " + e.message); } }}]);
}
async function trainingAktion(id, was) {
  if (was === "stoppen" && !confirm("Training stoppen? Der zuletzt gespeicherte Adapter bleibt erhalten.")) return;
  try {
    await apiPost("/api/training/" + id + "/" + was, {});
    // Bereitgestellte Schüler kommen und gehen als Modelle — die Auswahl neu laden.
    if (was === "bereitstellen" || was === "beenden") await modelleNeuLaden();
    renderTraining();
  }
  catch(e) { toast("Nicht möglich: " + e.message); }
}
async function trainingEinstellungen() {
  try { await apiPost("/api/settings", {TRAINING_SUCHORTE: $("#tr-suchorte").value.trim(), TRAINING_PYTHON: $("#tr-python").value.trim(),
                                        LLAMA_CPP_DIR: $("#tr-llama").value.trim(), LLAMA_QUANTIZE: $("#tr-quantize").value.trim(),
                                        OLLAMA_BIN: $("#tr-ollama").value.trim()}); toast("Gespeichert"); renderTraining(); }
  catch(e) { toast("Nicht möglich: " + e.message); }
}

async function renderModelle() {

  const lokal = m.lokal || [];
  const netz = m.im_netz || [];

  $("#view").innerHTML = `<div class="view-pad">
    <div class="view-head"><div class="vh-ico">🧠</div>
      <div><h1>Modelle</h1><p>Drei Wege, ein Modell zu fahren. Sie schließen sich nicht aus — du wählst pro Aufgabe.</p></div>
      <div class="vh-actions"><button class="btn btn-ghost" onclick="renderModelle()">↻ Aktualisieren</button></div></div>

    <div class="weg">
      <h3>1️⃣ 🔒 Lokal auf diesem Gerät</h3>
      <p class="was">Läuft über deinen eigenen Ollama. Nichts verlässt den Rechner — so wie Dive on Wide es immer schon gemacht hat. Am schnellsten, begrenzt durch deinen Arbeitsspeicher.</p>
      ${lokal.length ? lokal.map(x => `
        <div class="modell"><span>🔒</span><span class="mn">${esc(x.label)}</span>
          <span class="mw">${esc(x.provider||"")}</span></div>`).join("")

    </div>

    <div class="weg">
      <h3>2️⃣ 🤿 Im Diving Net</h3>
      <p class="was">Ein Modell, das <b>ein anderes Gerät</b> in deinem Netz fährt. Der Auftrag geht versiegelt hin, das Ergebnis versiegelt zurück — <b>zusammengesetzt wird es nur auf deinem Gerät</b>. Kein Zwischenspeicher, kein Server.</p>
      ${!m.laeuft
        ? `<p style="color:var(--text-2)">Das Netzwerk läuft nicht. <button class="btn btn-ghost btn-sm" onclick="show('mesh')">Zum Netzwerk</button></p>`

            <div class="modell"><span>🏠</span><span class="mn">${esc(x.name)}</span>
              <span class="mw">${x.knoten} Gerät(e)${x.auch_hier?" · auch hier":""}</span>
              <button class="btn btn-ghost btn-sm" onclick="modAuftragNeu('${jsarg(x.name)}')">Auftrag geben</button>
            </div>`).join("")
          : `<p style="color:var(--text-2)">Noch kein anderes Gerät im Netz nennt ein Modell. Starte Dive on Wide auf einem zweiten Gerät und erlaube dort Aufträge.</p>`)}
    </div>

    <div class="weg">
      <h3>3️⃣ 🌍 Global geteilter Compute</h3>
      <p class="was">Dasselbe wie im Diving Net, nur mit fremden Knoten in der <b>Weite</b>. Deutlich mehr Rechenleistung, dafür Fremde im Netz — deshalb werden Aufträge mehrfach gestellt und die Antworten verglichen.</p>
      ${m.betriebsart === "weite"
        ? `<p style="color:var(--green)">● Dieser Knoten läuft in der Weite.</p>`
        : `<p style="color:var(--text-2)" data-roh>${m.laeuft
            ? L("Dieser Knoten läuft im Diving Net.", "This node runs in the Diving Net.")
            : L("Dieser Knoten läuft nicht.", "This node is not running.")} ${L("Die Weite ist eine eigene Betriebsart — der Wechsel braucht einen Neustart des Netzwerks.", "Open Net is a separate mode — switching needs a restart of the network.")}</p>`}

    <div class="weg">
      <h3>🤝 Dein Beitrag</h3>
      <p class="was">Ob dieses Gerät <b>fremde</b> Aufträge auf deinen Modellen rechnet. Ein fremder Auftrag darf genau einen Modellaufruf machen — nichts starten, nichts ausführen, keine Werkzeuge.</p>
      ${m.laeuft ? `
        <div class="cu-check">
          ${cuRow("Aufträge annehmen", m.auftraege_erlaubt, m.auftraege_erlaubt?"ja":"aus")}
          ${cuRow("Modelle, die du anbietest", (m.eigene_im_netz||[]).length>0, (m.eigene_im_netz||[]).length+"")}

function modAuftragNeu(modell) {
  openModal("Auftrag an " + esc(modell), `
    <p style="color:var(--text-2)">Der Auftrag geht versiegelt an die Geräte, die dieses Modell fahren. Sie sehen den Text — <b>sie können ihn lesen</b>. Schick nichts, was du diesen Menschen nicht zeigen würdest.</p>
    <div class="field"><label>Auftrag</label>
      <textarea id="mod-prompt" rows="4" placeholder="Was soll das Modell tun?"></textarea></div>
    <div class="field" style="max-width:240px"><label>An wie viele Geräte (Vergleich)</label>
      <input id="mod-anz" type="number" min="1" max="5" value="2"></div>
    <p style="color:var(--text-3);font-size:12.5px">Mehrfach zu fragen ist kein Luxus: Ein Gerät kann verschwinden, und bei fremden Knoten ist der Vergleich zweier Antworten die einzige Handhabe gegen absichtlich falsche Ergebnisse.</p>`,
    [{label:"Abbrechen", action:closeModal},
     {label:"Absenden", primary:true, action:() => modAuftragAb(modell)}]);
}

async function modAuftragAb(modell) {
  const prompt = $("#mod-prompt").value;
  const anz = Number($("#mod-anz").value) || 2;
  try {
    const r = await apiPost("/api/mesh/auftrag-neu",
                        {prompt: prompt, modell: modell, hoechstens: anz});
    if (r.fehler) return toast(r.fehler);
    modAuftrag = r.id; closeModal(); toast("Auftrag verteilt ⏳"); renderModelle();
  } catch(e) { toast(e.message); }
}

async function modAuftragLage() {
  if (!modAuftrag) return;
  let l = null;
  try {
    l = await api("/api/mesh/auftrag?id=" + encodeURIComponent(modAuftrag));
    if (l.fehler) throw new Error(l.fehler);
  } catch(e) { modAuftrag = null; return; }
  const lage = $("#mod-lage"), erg = $("#mod-erg");
  if (!lage || !erg) return;
  lage.innerHTML = `<code>${esc(l.modell)}</code> · ${l.gefragt} Gerät(e) gefragt ·
    ${l.offen} offen · ${l.wartet_s}s
    <button class="btn btn-ghost btn-sm" onclick="modAuftragWeg()">✕ Verwerfen</button>`;
  erg.innerHTML = (l.ergebnisse || []).map(e => `
    <div class="erg ${e.fehler?"fehler":""}">
      <div class="von">von ${esc(e.von)}</div>
      <div class="txt">${esc(e.fehler || e.text || "")}</div></div>`).join("")
    || `<p style="color:var(--text-3)">Noch keine Antwort. Ein verteilter Auftrag kann dauern.</p>`;
  if (l.offen > 0) setTimeout(modAuftragLage, 2000);
}

function modAuftragWeg() { modAuftrag = null; renderModelle(); }

async function modBeitrag(ja) {
  try { await apiPost("/api/mesh/auftraege-an", {ja: ja}); }
  catch(e) { return toast(e.message); }
  toast(ja ? "Du nimmst jetzt Aufträge an 🤝" : "Keine fremden Aufträge mehr");
  renderModelle();
}

async function openSession(id) {
  if (state.sessionId !== id) { state.angeheftet = []; state.verdichtung = null; state.kontext = null; }

  state.messages = (await api("/api/sessions/" + id + "/messages"))
    .map(m => ({role: m.role, content: m.content, wissen: m.wissen ? String(m.wissen).split("\n") : undefined}));
  const sess = state.sessions.find(s => s.id === id);
  state.currentAgent = sess && sess.agent_id
    ? state.agents.find(a => a.id === sess.agent_id) || null : null;

  /* Auch die Unterhaltung gehört in die Adresse: Ein neu geladenes Fenster
     landete sonst in einem leeren Chat, obwohl man gerade mittendrin war. */
  try { history.replaceState(null, "", "#chat/" + id); } catch (e) {}
}

  } else {

  $("#view").innerHTML = `

  fillModelSelect();
  fillAgentSelect();
  renderModeStrip();
  kontextAnzeigen();
  modusAnzeigen();
  const ms = $("#model-select"); if (ms) ms.addEventListener("change", modusAnzeigen);

  inp.addEventListener("keydown", inputKeydown);
  inp.addEventListener("input", () => { autoGrow(inp); updateAutocomplete(); });

}
function msgHtml(m) {
  if (m.role === "system-note")
    return `<div class="sysnote">${m.content}</div>`;
  if (m.role === "run")
    return `<div class="run-card ${m.status||"running"}" data-run="${m.runId}">${runCardInner(m)}</div>`;
  const who = m.role === "user" ? "Du" : "Dive on Wide";
  const av  = m.role === "user" ? "D" : "◆";
  return `<div class="msg ${m.role}"><div class="avatar">${av}</div>
    <div class="m-body"><div class="m-name">${who}</div>
    <div class="m-content">${m.role==="user" ? esc(m.content).replace(/\n/g,"<br>") : renderMarkdown(m.content)}</div>
    ${m.wissen && m.wissen.length ? `<div class="m-wissen" data-roh>📚 ${L("Wissen genutzt", "Knowledge used")}: ${m.wissen.map(esc).join(", ")}</div>` : ""}
    ${m.role==="assistant" && !m.streaming ? `<div class="m-actions">
       <button onclick="copyMsg(this)">Kopieren</button>
       <button onclick="saveMsgArtifact(this)">Als Artefakt speichern</button>
       <button onclick="sichernAnheften(this)" title="${esc(L("Als Artefakt sichern und an diesen Chat heften — geht nie verloren, auch wenn ältere Nachrichten verdichtet werden", "Save as artifact and attach to this chat — never lost, even when older messages are condensed"))}">📎 ${L("Sichern & anheften", "Save & attach")}</button></div>` : ""}
    </div></div>`;
}
function copyMsg(btn){
  const i = [...document.querySelectorAll(".msg.assistant")].indexOf(btn.closest(".msg"));
  const assistants = state.messages.filter(m=>m.role==="assistant");
  navigator.clipboard.writeText(assistants[i]?.content || "").then(()=>toast("Kopiert ✅"));
}
async function saveMsgArtifact(btn){
  const i = [...document.querySelectorAll(".msg.assistant")].indexOf(btn.closest(".msg"));
  const assistants = state.messages.filter(m=>m.role==="assistant");
  const name = prompt("Dateiname:", "antwort.md");
  if (!name) return;
  await api("/api/artifacts", {method:"POST", body: JSON.stringify(
    {filename:name, title:name, content:assistants[i]?.content||"", session_id: state.sessionId})});
  toast("Artefakt gespeichert 📄");
}
/* Modus der Eingabe: Chat, Orchestrator (jede Nachricht ist ein Ziel) oder Werkbank (Leiste aus der Eingabe). */
function modusWahl(m) {
  if (m === "werkbank") { state.chatModus = "chat"; toolWerkbank(); return; }
  werkbankLeisteZu();
  if (state.mode && state.mode.kind === "werkbank") setMode(null);
  state.chatModus = m;
  modusAnzeigen();
  const i = $("#input"); if (i) i.focus();
}
function modusAnzeigen() {
  const leisteOffen = !!($("#wb-leiste") && !$("#wb-leiste").hidden);
  const aktiv = (leisteOffen || (state.mode && state.mode.kind === "werkbank")) ? "werkbank" : (state.chatModus || "chat");
  document.querySelectorAll(".modus-wahl button").forEach(b => b.classList.toggle("an", b.dataset.modus === aktiv));
  const inp = $("#input");
  if (inp && (!state.mode || state.mode.kind === "werkbank")) inp.placeholder = aktiv === "orchestrator" ? L("Beschreib dein Ziel — der Orchestrator plant und erledigt es …", "Describe your goal — the orchestrator plans and does it …")
    : aktiv === "werkbank" ? L("Auftrag an die Werkbank, z. B. „Behebe den fehlschlagenden Test“ …", "Task for the workbench, e.g. “Fix the failing test” …")
    : L("Nachricht schreiben — / für Prompts & Wissen, @ für Skills …", "Write a message — / for prompts & knowledge, @ for skills …");
  const ort = $("#modell-ort"), wahl = ($("#model-select") || {}).value || state.defaultModel;
  const m = (state.models || []).find(x => x.name === wahl);
  if (ort) ort.innerHTML = m && m.extern ? `<span style="color:var(--red)">☁️ ${esc(L("Cloud-Modell — verlässt den Rechner", "Cloud model — leaves this machine"))}</span>`
                                         : "🔒 " + esc(L("Läuft auf deinem Rechner", "Runs on your machine"));
}
function werkbankLeisteZeigen(html, knoepfe) {
  const el = $("#wb-leiste"); if (!el) return;
  el.innerHTML = `<div class="wl-griff" title="${esc(L("Ziehen zum Vergrößern, Klick schließt", "Drag to resize, click closes"))}"></div>
    <div class="wl-kopf"><b>🛠 ${esc(L("Werkbank", "Workbench"))}</b><button class="mo-close" onclick="modusWahl('chat')" title="${esc(L("Schließen", "Close"))}">✕</button></div>
    <div class="wl-inhalt">${html}</div>
    <div class="wl-fuss"></div>`;
  const fuss = el.querySelector(".wl-fuss");
  // Nebensachen (Gedächtnis, Skills, Checkpunkte …) unter „Mehr“, damit die Leiste auch auf dem Handy Platz hat.
  const mehr = document.createElement("details"); mehr.className = "wl-mehr";
  mehr.innerHTML = `<summary class="btn btn-ghost btn-sm">${esc(L("Mehr …", "More …"))}</summary><div class="wl-mehr-liste"></div>`;
  knoepfe.forEach(k => {
    const b = document.createElement("button");
    b.className = "btn " + (k.primary ? "btn-primary" : "btn-ghost btn-sm");
    b.textContent = k.label; b.onclick = k.action;
    (k.primary ? fuss : mehr.querySelector(".wl-mehr-liste")).appendChild(b);
  });
  fuss.prepend(mehr);
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add("offen"));
  werkbankWarnung(); modusAnzeigen();
  leisteZiehen(el.querySelector(".wl-griff"), el);
}
function werkbankLeisteZu() {
  const el = $("#wb-leiste"); if (!el || el.hidden) return;

/* Am Griff ziehen ändert die Höhe der Leiste; ein Klick ohne Ziehen schließt sie. */
function leisteZiehen(griff, el) {
  if (!griff) return;
  griff.addEventListener("pointerdown", ev => {
    const start = ev.clientY, hoehe = el.getBoundingClientRect().height; let bewegt = false;
    griff.setPointerCapture(ev.pointerId);
    const zug = e => { const d = start - e.clientY; if (Math.abs(d) > 3) bewegt = true;
      el.style.maxHeight = Math.max(160, Math.min(window.innerHeight * 0.85, hoehe + d)) + "px"; };
    const los = () => { griff.removeEventListener("pointermove", zug); griff.removeEventListener("pointerup", los);
      if (!bewegt) modusWahl("chat"); };
    griff.addEventListener("pointermove", zug); griff.addEventListener("pointerup", los);
  });
}
/* Ein Ergebnis, das bleiben soll: als Artefakt sichern UND anheften — es geht dann mit jeder Nachricht mit und
   übersteht jede Verdichtung des Verlaufs. */
async function sichernAnheften(btn) {
  const i = [...document.querySelectorAll(".msg.assistant")].indexOf(btn.closest(".msg"));
  const inhalt = (state.messages.filter(m => m.role === "assistant")[i] || {}).content || "";
  const erste = (inhalt.split("\n").find(z => z.trim()) || "ergebnis").replace(/[#*`>\[\]]/g, "").trim().slice(0, 40);
  const name = (erste || "ergebnis").replace(/[^\wäöüÄÖÜß -]/g, "").trim().replace(/\s+/g, "-") + ".md";
  try {
    const a = await api("/api/artifacts", {method: "POST", body: JSON.stringify(
      {filename: name, title: erste, content: inhalt, session_id: state.sessionId})});
    const frei = ANHEFTEN_GESAMT - state.angeheftet.reduce((n, x) => n + x.inhalt.length, 0);
    if (frei < 500) { toast(L("Gesichert — aber zum Anheften ist kein Platz mehr frei.", "Saved — but there is no room left to attach it.")); return; }
    state.angeheftet.push({art: "artefakt", id: a.id || name, name, inhalt: inhalt.slice(0, Math.min(ANHEFTEN_MAX, frei))});
    renderModeStrip();
    toast("📎 " + L("Gesichert und angeheftet", "Saved and attached"));
  } catch (e) { toast(e.message); }
}

/* Anheften: Wissen oder Artefakte gehen mit JEDER Nachricht dieses Chats mit — wie die Übergabe zwischen den
   Schritten einer Pipeline. Je Eintrag höchstens 8 000 Zeichen, damit kleine Kontexte nicht platzen. */
const ANHEFTEN_MAX = 8000;
const ANHEFTEN_GESAMT = 24000;    /* alles Angeheftete zusammen (~7 000 Token) — zehn Stücke à 8 000 sprengten 16k-Kontexte */
async function toolAnheften() {
  closeModal();
  let arts = [];
  try { arts = await api("/api/artifacts"); } catch (e) {}
  try { state.knowledge = await api("/api/knowledge"); } catch (e) {}
  const liste = [
    ...(state.knowledge || []).map(k => ({art: "wissen", id: k.id, name: k.name, info: k.folder || ""})),
    ...arts.map(a => ({art: "artefakt", id: a.id, name: a.filename || a.name || a.id, info: L("Artefakt", "Artifact")}))];
  state._anheftListe = liste;
  openModal(L("📎 Anheften", "📎 Attach"), `
    <p style="color:var(--text-2);margin-bottom:10px" data-roh>${L("Was du anheftest, bekommt das Modell bei jeder Nachricht dieses Chats mit.", "What you attach is sent to the model with every message in this chat.")}</p>
    <input id="anheft-filter" style="width:100%;margin-bottom:10px" placeholder="${esc(L("Suchen …", "Search …"))}" oninput="anheftListe()">
    <div id="anheft-liste" style="display:flex;flex-direction:column;gap:6px"></div>`);
  anheftListe();
}
function anheftListe() {
  const q = (($("#anheft-filter") || {}).value || "").toLowerCase();
  const an = new Set((state.angeheftet || []).map(a => a.art + a.id));
  $("#anheft-liste").innerHTML = (state._anheftListe || []).filter(x => !q || x.name.toLowerCase().includes(q)).slice(0, 60)
    .map((x, i) => `<button class="tool-btn" style="flex-direction:row;align-items:center;justify-content:space-between" onclick="anheftenUm('${jsarg(x.art)}','${jsarg(x.id)}')">
      <span>${x.art === "wissen" ? "📚" : "📄"} ${esc(x.name)} <small style="color:var(--text-3)">${esc(x.info)}</small></span>
      <b>${an.has(x.art + x.id) ? "✓" : "＋"}</b></button>`).join("")
    || `<p style="color:var(--text-3)" data-roh>${L("Noch kein Wissen und keine Artefakte.", "No knowledge or artifacts yet.")}</p>`;
}
async function anheftenUm(art, id) {
  const i = state.angeheftet.findIndex(a => a.art === art && a.id === id);
  if (i >= 0) state.angeheftet.splice(i, 1);
  else {
    const x = state._anheftListe.find(x => x.art === art && x.id === id); if (!x) return;
    let inhalt = "";
    try {
      inhalt = art === "wissen" ? ((state.knowledge.find(k => k.id === id) || {}).content || "")
        : ((await api("/api/artifacts/" + id + "/content")).content || "");
    } catch (e) { toast(e.message); return; }
    const frei = ANHEFTEN_GESAMT - state.angeheftet.reduce((n, a) => n + a.inhalt.length, 0);
    if (frei < 500) { toast(L("📎 Es ist schon so viel angeheftet, wie ins Modell passt — erst etwas lösen.", "📎 As much is attached as fits the model — remove something first.")); return; }
    if (inhalt.length > Math.min(ANHEFTEN_MAX, frei)) toast(L("📎 Gekürzt angeheftet — das Modell sieht den Anfang.", "📎 Attached shortened — the model sees the beginning."));
    state.angeheftet.push({art, id, name: x.name, inhalt: inhalt.slice(0, Math.min(ANHEFTEN_MAX, frei))});
  }
  anheftListe(); renderModeStrip();
}

  if (!(state.angeheftet || []).length) return "";

async function werkbankBefehlHinweis(text) {

  const m = /^\/([\w:-]*)(\s|$)/.exec(text || "");
  if (!m) { el.innerHTML = ""; return; }
  if (!werkbankBefehlCache) {
    const v = werkbankVorgaben();
    try { werkbankBefehlCache = (await api("/api/werkbank/befehle?" + werkbankProjektQuery(v))).befehle; }
    catch(_) { werkbankBefehlCache = []; }
  }
  const name = m[1].toLowerCase(), fertig = !!m[2];
  const treffer = werkbankBefehlCache.filter(b => fertig ? b.name === name : b.name.startsWith(name)).slice(0, 6);
  el.innerHTML = treffer.length
    ? treffer.map(b => `<div style="padding:2px 0">📜 <b>/${esc(b.name)}</b>${b.hinweis ? " <code>" + esc(b.hinweis) + "</code>" : ""} — ${esc(b.beschreibung)} <span style="color:var(--text-3)">· ${esc(b.herkunft)}</span></div>`).join("")
    : (fertig ? `<span style="color:var(--text-3)">Kein eigener Befehl „/${esc(name)}“ — der Text geht wörtlich an den Diver.</span>` : "");
}

function stepChain(steps) {
  const icons = {agent:"🤖", skill:"⚡", prompt:"💬", web:"🌐", research:"🔭",
                 code:"🧰", image:"🎨", browser:"🖥", think:"🤔"};
  return (Array.isArray(steps)?steps:[]).map(s => {
    const t = s.type || "agent";
    let name = "";
    if (t === "agent") { const a = state.agents.find(a=>a.id===(s.ref_id||s.agent_id)); name = a?a.name:"?"; }
    else if (t === "skill") { const k = state.skills.find(k=>k.id===s.ref_id); name = k?k.name:"?"; }
    else name = {web:"Web", research:"Research", code:"Code", image:"Bild",
                 prompt:"Prompt", browser:"Browser", think:"Denken"}[t]||t;
    return (icons[t]||"•") + " " + esc(name);
  }).join(" → ");
}

/* ---------- Live-Karte für laufende Hintergrundprozesse ---------- */
async function trackRun(runId, title) {
  const idx = state.messages.push({role:"run", runId, title, status:"running", progress:[]}) - 1;
  renderChat();
  const poll = async () => {
    let r;
    try { r = await api("/api/runs/" + runId); } catch(_) { return; }
    const m = state.messages[idx];
    if (!m || m.runId !== runId) return;          // Chat wurde gewechselt
    m.status = r.status; m.progress = r.progress; m.pending = r.pending || "";
    // Wartet eine Aktion auf Freigabe, häufiger nachfragen (Schranke reaktiv halten)
    if (r.status === "running") { updateRunCard(idx, m); setTimeout(poll, r.pending ? 800 : 2000); }
    else {
      // Ergebnis wurde serverseitig als Nachricht abgelegt → Verlauf neu laden
      if (state.sessionId) {
        state.messages = (await api("/api/sessions/" + state.sessionId + "/messages"))
          .map(x => ({role:x.role, content:x.content}));
      }
      renderChat();
      toast(r.status === "error" ? "⚠️ Lauf fehlgeschlagen"
        : r.status === "cancelled" ? "⏹ " + title + " abgebrochen"
        : "✅ " + title + " fertig");
    }
  };
  setTimeout(poll, 1200);
}
function updateRunCard(idx, m) {
  const el = document.querySelector(`[data-run="${m.runId}"]`);
  if (el) el.innerHTML = runCardInner(m); else renderChat();
}
function runCardInner(m) {
  const icon = m.status === "running" ? '<span class="spinner"></span>'
    : m.status === "error" ? "⚠️" : m.status === "cancelled" ? "⏹" : "✅";
  const stop = m.status === "running"
    ? `<button class="btn btn-ghost btn-sm" style="float:right"
        onclick="cancelRun('${jsarg(m.runId)}')">✕ Abbrechen</button>` : "";
  const diff = /^Werkbank/.test(m.title || "")
    ? `<button class="btn btn-ghost btn-sm" style="float:right;margin-right:6px"
        onclick="werkbankDiff('${jsarg(m.runId)}')">± Änderungen</button>` : "";
  // Bestätigungs-Schranke: wartet der Lauf auf Freigabe einer Computer-Use-Aktion?
  const gate = (m.status === "running" && m.pending)
    ? `<div style="margin-top:10px;padding:12px;border:1px solid var(--primary);
         border-radius:10px;background:var(--primary-soft)">
        <div style="margin-bottom:8px"><b>Aktion wartet auf deine Freigabe:</b><br>${esc(m.pending)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="confirmRun('${jsarg(m.runId)}',true,false)">✓ Ausführen</button>
          <button class="btn btn-ghost btn-sm" onclick="confirmRun('${jsarg(m.runId)}',true,true)">✓✓ Alles im Lauf</button>
          <button class="btn btn-ghost btn-sm" onclick="confirmRun('${jsarg(m.runId)}',false,false)">✕ Ablehnen</button>
        </div></div>` : "";
  return `${stop}${diff}<h4>${icon} ${esc(m.title)}</h4>
    <div class="r-steps" style="white-space:pre-line">${(m.progress||[]).slice(-8).map(s =>
      `<div>${s.state==="active"?"▸":"✓"} ${esc(s.text)}</div>`).join("")
      || "<div>▸ wird vorbereitet …</div>"}</div>${gate}`;
}

        toast("⏹ Abbruch angefordert — der Lauf endet am nächsten Schritt"); }

async function confirmRun(runId, ok, alle) {

/* ---------- Autocomplete (@Skills, /Prompts & Wissen) ---------- */
function updateAutocomplete() {
  const inp = $("#input"), box = $("#autocomplete");
  if (!inp || !box) return;
  const val = inp.value;
  const m = val.match(/(^|\s)([@\/])([\wäöüß-]*)$/i);
  if (!m) { box.style.display="none"; state.acMode=null; return; }
  const mode = m[2], q = m[3].toLowerCase();
  let items = [];
  if (mode === "@") {
    items = state.skills
      .filter(s => (s.trigger_word||s.name).toLowerCase().includes(q))
      .map(s => ({type:"skill", id:s.id, label:"@"+(s.trigger_word||s.name), desc:s.description}));
  } else {
    const cmds = [
      {cmd:"research", label:"/research", desc:"Deep-Research-Schleife zu einem Thema starten"},
      {cmd:"pipeline", label:"/pipeline", desc:"Eine Pipeline auswählen und starten"},
      {cmd:"browser",  label:"/browser",  desc:"Browser-Diver: echte Seiten öffnen und auswerten"},
      {cmd:"zeig",     label:"/zeig",     desc:"Computer-Use (Alpha): Element auf dem Bildschirm finden"},
      {cmd:"steuern",  label:"/steuern",  desc:"Computer-Use (Alpha): Aufgabe am Rechner erledigen lassen"},
      {cmd:"orchestrator", label:"/orchestrator", desc:"Beschreibe ein Ziel — der Orchestrator richtet alles ein und erledigt es"},
      {cmd:"werkbank", label:"/werkbank", desc:"Werkbank-Diver: Aufgabe in einem echten Projekt lösen"},
      {cmd:"code",     label:"/code",     desc:"Coding-Diver beauftragen (schreibt & testet Code)"},
      {cmd:"agent",    label:"/agent",    desc:"Diver für die Unterhaltung wählen"},
      {cmd:"web",      label:"/web",      desc:"Web-Recherche an- oder ausschalten"},
      {cmd:"hilfe",    label:"/hilfe",    desc:"Alle Werkzeuge anzeigen"},
    ].filter(c => c.cmd.startsWith(q) || !q)
     .map(c => ({type:"command", cmd:c.cmd, label:c.label, desc:c.desc}));
    items = cmds
      .concat(state.prompts.filter(p=>p.name.toLowerCase().includes(q))
        .map(p=>({type:"prompt", id:p.id, label:"💬 "+p.name, desc:p.description})))
      .concat(state.knowledge.filter(k=>k.name.toLowerCase().includes(q))
        .map(k=>({type:"knowledge", id:k.id, label:"📚 "+k.name, desc:"Wissen als Kontext anhängen"})));
  }
  state.acItems = items.slice(0,8); state.acSel = 0; state.acMode = mode;
  if (!items.length) { box.style.display="none"; return; }
  box.innerHTML = `<div class="ac-head">${mode==="@"?"Skills":"Prompts & Wissen"}</div>` +
    state.acItems.map((it,i)=>`<button class="ac-item${i===0?" sel":""}" onmousedown="acPick(${i});event.preventDefault()">
      <b>${esc(it.label)}</b><small>${esc(it.desc||"")}</small></button>`).join("");
  box.style.display = "block";
}
function acPick(i) {
  const it = state.acItems[i]; if (!it) return;
  const inp = $("#input");
  if (it.type === "command") {
    inp.value = inp.value.replace(/\/[\wäöüß-]*$/i, "/" + it.cmd + " ");
    $("#autocomplete").style.display = "none";
    autoGrow(inp); inp.focus();
    if (it.cmd === "web" || it.cmd === "hilfe") send();
    return;
  }
  if (it.type === "skill") {
    inp.value = inp.value.replace(/([@\/])[\wäöüß-]*$/i, it.label + " ");
  } else if (it.type === "prompt") {
    const p = state.prompts.find(p=>p.id===it.id);
    inp.value = inp.value.replace(/([@\/])[\wäöüß-]*$/i, "") + (p ? p.content : "");
  } else {
    const k = state.knowledge.find(k=>k.id===it.id);
    inp.value = inp.value.replace(/([@\/])[\wäöüß-]*$/i, "");
    if (k) state._pendingKnowledge = k;
    toast("Wissen „" + (k?k.name:"") + "“ wird der nächsten Nachricht als Kontext angehängt 📚");
  }
  $("#autocomplete").style.display = "none";
  autoGrow(inp); inp.focus();
}
function inputKeydown(e) {
  const box = $("#autocomplete");
  if (box.style.display === "block") {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      state.acSel = (state.acSel + (e.key==="ArrowDown"?1:-1) + state.acItems.length) % state.acItems.length;
      box.querySelectorAll(".ac-item").forEach((el,i)=>el.classList.toggle("sel", i===state.acSel));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acPick(state.acSel); return; }
    if (e.key === "Escape") { box.style.display="none"; return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
}

/* ---------- Senden & Streaming ---------- */
async function ensureSession(titleHint) {
  if (state.sessionId) return state.sessionId;
  const s = await api("/api/sessions", {method:"POST", body: JSON.stringify(
    {title: (titleHint||"Neuer Chat").slice(0,48),
     agent_id: state.currentAgent ? state.currentAgent.id : ""})});
  state.sessionId = s.id;
  loadSessions();
  return s.id;
}
async function send() {
  const inp = $("#input");
  let text = inp.value.trim();
  if (!text || state.streaming) return;
  // Orchestrator-Modus: jede Nachricht ist ein Ziel (außer ausdrücklichen /Befehlen oder einem aktiven Werkzeug).
  if (state.chatModus === "orchestrator" && !state.mode && !text.startsWith("/")) text = "/orchestrator " + text;

  // --- Slash-Befehle: Automation direkt aus der Eingabezeile ---
  const cmd = text.match(/^\/(research|recherche|browser|zeig|steuern|orchestrator|dirigent|pipeline|code|agent|web|hilfe|help)\b\s*([\s\S]*)$/i);
  if (cmd) {
    const rest = cmd[2].trim();
    const c = cmd[1].toLowerCase();
    inp.value = ""; autoGrow(inp);
    if (c === "web") { toggleWeb(); renderModeStrip(); return; }
    if (c === "hilfe" || c === "help") { openTools(); return; }
    if (c === "agent") {
      const a = state.agents.find(a => a.name.toLowerCase().includes(rest.toLowerCase()));
      if (rest && a) { pickAgentFromTools(a.id); } else { toolAgent(); }
      return;
    }
    if (c === "pipeline") {
      const p = (state.pipelines||[]).find(p => p.name.toLowerCase().includes(rest.toLowerCase()));
      if (rest && p) { setMode({kind:"pipeline", id:p.id, name:p.name}); toast("⛓️ " + p.name + " aktiv — jetzt Eingabe schicken"); }
      else { await toolPipeline(); }
      return;
    }
    if (c === "browser") {
      if (!rest) { await toolBrowser(); return; }
      await ensureSession(rest);
      state.messages.push({role:"user", content:text});
      try {
        const r = await api("/api/web/browser_task", {method:"POST", body: JSON.stringify(
          {task: rest, session_id: state.sessionId})});
        trackRun(r.run_id, "Browser-Auftrag");
      } catch(e) {
        state.messages.push({role:"system-note",
          content:"⚠️ " + esc(e.message) + " — <b>Diagnose unter Deep Research</b>."});
        renderChat();
      }
      return;
    }
    if (c === "zeig") {
      if (!rest) { toast("Was soll ich finden? Beispiel: /zeig der rote Senden-Knopf"); return; }
      await ensureSession(rest);
      state.messages.push({role:"user", content:text});
      try {
        const r = await api("/api/computer/zeig", {method:"POST", body: JSON.stringify(
          {beschreibung: rest, session_id: state.sessionId})});
        trackRun(r.run_id, "Zeig mir wo");
      } catch(e) {
        state.messages.push({role:"system-note",
          content:"⚠️ " + esc(e.message) + " — <b>Diagnose unter Einstellungen → Computer-Use</b>."});
        renderChat();
      }
      return;
    }
    if (c === "orchestrator" || c === "dirigent") {
      if (!rest) { toast("Beschreibe dein Ziel: /orchestrator recherchiere X und schreibe eine Zusammenfassung"); return; }
      await ensureSession(rest);
      const zielText = state.chatModus === "orchestrator" ? "🎼 " + rest : text;
      state.messages.push({role:"user", content: zielText});
      // Auch das Ziel gehört in den Verlauf — sonst fehlte es nach dem Neuladen (09.10.2026)
      api("/api/sessions/" + state.sessionId + "/messages", {method:"POST",
        body: JSON.stringify({role:"user", content: zielText})}).catch(()=>{});
      try {
        const r = await api("/api/orchestrator", {method:"POST", body: JSON.stringify(
          {ziel: rest, session_id: state.sessionId, angeheftet: angeheftetText()})});
        trackRun(r.run_id, "Orchestrator");
      } catch(e) {
        state.messages.push({role:"system-note", content:"⚠️ " + esc(e.message)});
        renderChat();
      }
      return;
    }
    if (c === "steuern") {
      if (!rest) { toast("Was soll ich erledigen? Beispiel: /steuern öffne die Systemeinstellungen"); return; }
      await ensureSession(rest);
      state.messages.push({role:"user", content:text});
      try {
        const r = await api("/api/computer/steuern", {method:"POST", body: JSON.stringify(
          {auftrag: rest, session_id: state.sessionId})});
        trackRun(r.run_id, "Computer-Use");
      } catch(e) {
        state.messages.push({role:"system-note",
          content:"⚠️ " + esc(e.message) + " — <b>Einstellungen → Computer-Use</b>."});
        renderChat();
      }
      return;
    }
    if (c === "werkbank") {
      if (!rest) { toolWerkbank(); return; }
      await ensureSession(rest);
      state.messages.push({role:"user", content:text});
      try { await werkbankStarten(rest, werkbankVorgaben()); }
      catch(e) {
        state.messages.push({role:"system-note", content:"⚠️ " + esc(e.message)});
        renderChat();
      }
      return;
    }
    if (c === "code") {
      if (!rest) { toolCode(); return; }
      await ensureSession(rest);
      state.messages.push({role:"user", content:text});
      const r = await api("/api/sandbox/agent", {method:"POST", body: JSON.stringify(
        {task: rest, workspace:"chat-projekt", iterations:4, session_id: state.sessionId})});
      trackRun(r.run_id, "Coding-Diver");
      return;
    }
    // research / recherche
    if (!rest) { toolResearch(); return; }
    await ensureSession(rest);
    state.messages.push({role:"user", content:text});
    const r = await api("/api/research/run", {method:"POST", body: JSON.stringify(
      {topic: rest, loops: 3, use_web: true, session_id: state.sessionId})});
    trackRun(r.run_id, "Deep Research");
    return;
  }

  // --- Aktiver Werkzeug-Modus? ---
  if (state.mode) {
    const m = state.mode;
    await ensureSession(text);
    state.messages.push({role:"user", content:text});
    inp.value = ""; autoGrow(inp);
    api("/api/sessions/" + state.sessionId + "/messages", {method:"POST",
      body: JSON.stringify({role:"user", content:text})}).catch(()=>{});
    let r, title;
    const model = ($("#model-select") && $("#model-select").value) || "";
    if (m.kind === "research") {
      title = "Deep Research";
      r = await api("/api/research/run", {method:"POST", body: JSON.stringify(
        {topic:text, loops:m.loops, use_web:m.use_web, model, session_id:state.sessionId})});
    } else if (m.kind === "skill") {
      title = "Skill: " + m.name;
      r = await api("/api/skills/" + m.id + "/run", {method:"POST", body: JSON.stringify(
        {input:text, model, session_id:state.sessionId})});
    } else if (m.kind === "pipeline") {
      title = "Pipeline: " + m.name;
      r = await api("/api/pipelines/" + m.id + "/run", {method:"POST", body: JSON.stringify(
        {input:text, model, session_id:state.sessionId})});
    } else if (m.kind === "werkbank") {
      try { await werkbankStarten(text, m); }
      catch(e) {
        state.messages.push({role:"system-note", content:"⚠️ " + esc(e.message)});
        renderChat();
      }
      return;
    } else if (m.kind === "schwarm") {
      title = "Schwarm";
      r = await api("/api/schwarm", {method:"POST", body: JSON.stringify(
        {ziel:text, planer:m.planer, arbeiter:m.arbeiter, runden:m.runden, testbefehl:m.testbefehl,
         angeheftet: angeheftetText(), session_id:state.sessionId})});
    } else if (m.kind === "browser") {
      title = "Browser-Auftrag";
      r = await api("/api/web/browser_task", {method:"POST", body: JSON.stringify(
        {task:text, model, max_steps:m.max_steps, session_id:state.sessionId})});
    } else {
      title = "Coding-Diver";
      r = await api("/api/sandbox/agent", {method:"POST", body: JSON.stringify(
        {task:text, workspace:m.workspace, iterations:m.iterations, model,
         session_id:state.sessionId})});
    }
    trackRun(r.run_id, title);
    return;
  }

  // @Skill-Trigger?
  const skillMatch = text.match(/^@([\wäöüß-]+)\s*([\s\S]*)$/i);
  if (skillMatch) {
    const skill = state.skills.find(s =>
      (s.trigger_word||"").toLowerCase() === skillMatch[1].toLowerCase() ||
      s.name.toLowerCase() === skillMatch[1].toLowerCase());
    if (skill) {
      if (!skillMatch[2].trim()) { toast("Bitte Text nach dem Skill-Trigger angeben."); return; }
      inp.value = ""; autoGrow(inp);
      await ensureSession(text);
      state.messages.push({role:"user", content:text});
      api("/api/sessions/" + state.sessionId + "/messages", {method:"POST",
        body: JSON.stringify({role:"user", content:text})}).catch(()=>{});
      const r = await api("/api/skills/" + skill.id + "/run", {method:"POST",
        body: JSON.stringify({input: skillMatch[2], model: $("#model-select").value,
                              session_id: state.sessionId})});
      trackRun(r.run_id, "Skill: " + skill.name);
      return;
    }
  }

  await ensureSession(text);

  // Wissen anhängen?
  let sendText = text;
  if (state._pendingKnowledge) {
    sendText = "Nutze folgendes Wissen als Kontext:\n\n---\n" + state._pendingKnowledge.content +
      "\n---\n\nAufgabe: " + text;
    state._pendingKnowledge = null;
  }

  inp.value = ""; autoGrow(inp);
  state.messages.push({role:"user", content:text});
  state.messages.push({role:"assistant", content:"", streaming:true});
  state.streaming = true;
  renderChat();
  $("#send-btn").disabled = true;
  api("/api/sessions/" + state.sessionId + "/messages", {method:"POST",
    body: JSON.stringify({role:"user", content:text})}).catch(()=>{});

  // Nachrichtenkontext bauen
  const sys = (state.currentAgent ? state.currentAgent.system_prompt :
    "Du bist Dive on Wide, ein lokaler KI-Arbeitsplatz. " + HERKUNFT +
    " Antworte hilfreich, präzise und auf Deutsch. Formatiere mit Markdown.") + angeheftetText();
  const history = state.messages.slice(0,-1).filter(m=>m.role==="user"||m.role==="assistant")
    .map(m=>({role:m.role, content:m.content}));
  history[history.length-1] = {role:"user", content: sendText};
  const mitZusammenfassung = !!(state.verdichtung && state.verdichtung.bis > 0 && state.verdichtung.bis <= history.length - 1);
  const gesendet = verlaufMitVerdichtung(history);
  const model = ($("#model-select") && $("#model-select").value) || state.defaultModel;
  const asstMsg = state.messages[state.messages.length-1];

  try {
    const resp = await fetch(API + "/api/chat", {method:"POST",
      headers: authHeaders(),
      body: JSON.stringify({model, web: state.webMode, sprache: SPRACHE.code,
        agent_id: state.currentAgent ? state.currentAgent.id : "",
        messages:[{role:"system",content:sys}, ...gesendet]})});
    if (resp.status === 401) { showLogin(); throw new Error("Zugangsschlüssel nötig"); }
    if (!resp.ok) { let e={}; try{e=await resp.json();}catch(_){}
      throw new Error(e.error || "Fehler " + resp.status); }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const j = JSON.parse(line);
          if (j.wissen) asstMsg.wissen = j.wissen;
          if (j.kontext) {
            state.kontext = j.kontext;
            if (j.kontext.system_gekuerzt) state.messages.splice(state.messages.length - 1, 0, {role: "system-note", content: "📎 " + esc(L(
              "Angeheftetes und Wissen waren zusammen zu groß für dieses Modell — das Modell sieht nur den Anfang. Weniger anheften oder ein Modell mit größerem Kontext wählen.",
              "Attachments and knowledge together were too large for this model — it only sees the beginning. Attach less or pick a model with a larger context."))});
            if (j.kontext.verdichtet > 0) {
              const vorher = mitZusammenfassung ? state.verdichtung.bis : 0;
              state.verdichtung = {bis: vorher + j.kontext.verdichtet - (mitZusammenfassung ? 2 : 0), text: j.kontext.zusammenfassung};
              state.messages.splice(state.messages.length - 1, 0, {role: "system-note", content: "🗜 " + esc(L(
                "Der Kontext war fast voll — ältere Nachrichten sind jetzt zusammengefasst. Was wörtlich bleiben soll: mit 📎 sichern & anheften.",
                "The context was almost full — older messages are now summarised. To keep something word for word: 📎 save & attach."))});
            }
            kontextAnzeigen();
          }
          if (j.message && j.message.content) {
            asstMsg.content += j.message.content;
            updateStreamingMsg(asstMsg.content);
          }
          if (j.error) throw new Error(j.error);
        } catch(err) { if (err instanceof SyntaxError) continue; throw err; }
      }
    }
    asstMsg.streaming = false;
    api("/api/sessions/" + state.sessionId + "/messages", {method:"POST",
      body: JSON.stringify({role:"assistant", content: asstMsg.content, model, wissen: asstMsg.wissen || []})}).catch(()=>{});
  } catch (err) {
    asstMsg.streaming = false;
    asstMsg.content = asstMsg.content || "";
    state.messages.push({role:"system-note",
      content:"⚠️ " + esc(err.message) + " — Läuft Ollama? Prüfe die <b>Einstellungen</b>."});
  }
  state.streaming = false;
  renderChat();
}
function updateStreamingMsg(content) {
  const msgs = document.querySelectorAll(".msg.assistant .m-content");
  const last = msgs[msgs.length-1];
  if (last) { last.innerHTML = renderMarkdown(content) + '<span class="typing"></span>'; scrollBottom(); }
}

/* Wissen ablegen: Dateien und Ordner vom Rechner. Der Browser liest sie selbst — nichts verlässt den Rechner,
   der Server bekommt nur den Text. Ordner werden durchlaufen; .git, node_modules und Versteckte bleiben draußen. */
const WISSEN_ENDUNGEN = /\.(txt|md|markdown|rst|org|csv|tsv|json|jsonl|yaml|yml|toml|ini|cfg|conf|xml|html?|css|js|mjs|ts|tsx|jsx|py|ipynb|rb|go|rs|java|kt|swift|c|h|cpp|hpp|cc|cs|php|sh|bash|zsh|ps1|bat|sql|r|m|lua|pl|ino|tex|log|env\.example)$/i;
const WISSEN_MAX_BYTE = 1024 * 1024, WISSEN_MAX_DATEIEN = 500;
function wissenUeberspringen(pfad) { return /(^|\/)(\.[^/]+|node_modules|__pycache__|venv|\.venv|dist|build)(\/|$)/.test(pfad); }
async function wissenEintraegeLesen(eintrag, pfad, aus) {
  if (aus.length >= WISSEN_MAX_DATEIEN || wissenUeberspringen(pfad)) return;
  if (eintrag.isFile) {
    const f = await new Promise((ok, nein) => eintrag.file(ok, nein));
    f.relPfad = pfad; aus.push(f);
  } else if (eintrag.isDirectory) {
    const leser = eintrag.createReader();
    for (;;) {
      const teil = await new Promise((ok, nein) => leser.readEntries(ok, nein));
      if (!teil.length) break;
      for (const e of teil) await wissenEintraegeLesen(e, pfad + "/" + e.name, aus);
    }
  }
}
async function wissenAblegen(ev) {
  ev.preventDefault(); ev.currentTarget.classList.remove("heiss");
  const dateien = [];
  for (const it of [...(ev.dataTransfer.items || [])]) {
    const e = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if (e) await wissenEintraegeLesen(e, e.name, dateien);
    else if (it.getAsFile && it.getAsFile()) dateien.push(it.getAsFile());
  }
  wissenDateien(dateien);
}
async function wissenDateien(dateien) {
  const zeig = t => { const stand = $("#wissen-stand"); if (stand) stand.textContent = t; };
  let neu = 0; const weg = [];
  dateien = dateien.slice(0, WISSEN_MAX_DATEIEN);
  for (const [i, f] of dateien.entries()) {
    const pfad = f.relPfad || f.webkitRelativePath || f.name;
    if (wissenUeberspringen(pfad)) continue;
    if (!WISSEN_ENDUNGEN.test(f.name)) { weg.push(f.name + " (" + L("Format", "format") + ")"); continue; }
    if (f.size > WISSEN_MAX_BYTE) { weg.push(f.name + " (> 1 MB)"); continue; }
    zeig(L("Lese", "Reading") + " " + (i + 1) + "/" + dateien.length + " … " + pfad);
    let text = "";
    try { text = await f.text(); } catch (e) { weg.push(f.name); continue; }
    if (text.includes("\u0000")) { weg.push(f.name + " (" + L("binär", "binary") + ")"); continue; }
    const teile = pfad.split("/"), ordner = teile.length > 1 ? teile[0] : L("Abgelegt", "Dropped");
    try {
      await api("/api/knowledge", {method: "POST", body: JSON.stringify({name: pfad, content: text, folder: ordner})});
      neu++;
    } catch (e) { weg.push(f.name + " (" + e.message + ")"); }
  }
  toast(L("📚 " + neu + " Dateien ins Wissen übernommen", "📚 " + neu + " files added to knowledge"));
  await renderKnowledge();
  if (weg.length) zeig(L("Übersprungen: ", "Skipped: ") + weg.slice(0, 12).join(", ") + (weg.length > 12 ? " …" : ""));
}

  think:    {icon:"🤔", label:"Denkschritt",    src:null,      hint:"Ordnen statt sammeln"},
