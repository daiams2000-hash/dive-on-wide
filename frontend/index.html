/* Drag-&-Drop-Zustand des Builders */
let builderSteps = [];      // [{type, ref_id, instruction}]
let pbDragFrom = null;      // Index (Umsortieren) ODER "new:<type>" (aus der Palette)

function pbDefaultStep(type){ return {type: type||"agent", ref_id:"", model:"", instruction:""}; }

async function openBuilder(id) {
  const [ag, sk, pr] = await Promise.all(
    [api("/api/agents"), api("/api/skills"), api("/api/prompts")]);
  state.agents = ag; state.skills = sk; state.prompts = pr;
  if (!state.pipelines.length) state.pipelines = await api("/api/pipelines");
  const p = id ? state.pipelines.find(x=>x.id===id) : null;
  builderSteps = (p && Array.isArray(p.steps) && p.steps.length)
    ? p.steps.map(s=>({type:s.type||"agent", ref_id:s.ref_id||s.agent_id||"",
                       model:s.model||"", instruction:s.instruction||""}))
    : [pbDefaultStep("agent"), pbDefaultStep("agent")];
  openModal(p ? "🛠️ Pipeline bearbeiten" : "🛠️ Pipeline bauen", `
    <div class="field"><label>Name</label><input id="bp-name" value="${esc(p?.name||"")}" placeholder="z. B. Konzept mit Faktenprüfung"></div>
    <div class="field"><label>Beschreibung</label><input id="bp-desc" value="${esc(p?.description||"")}" placeholder="Wofür ist dieser Workflow gut?"></div>
    <div class="pb-wrap">
      <div class="pb-palette">
        <h4>Bausteine</h4>
        <p style="font-size:11.5px;color:var(--text-3);margin-bottom:9px">Anklicken zum Anhängen oder in den Ablauf ziehen.</p>
        ${Object.entries(STEP_TYPES).map(([k,v])=>`
          <button class="step-chip" draggable="true"
            ondragstart="pbPaletteDrag(event,'${jsarg(k)}')" ondragend="pbDragEnd()"
            onclick="pbAdd('${jsarg(k)}')" title="${esc(v.hint)}">
            <span class="sc-ico">${v.icon}</span> ${v.label}</button>`).join("")}
      </div>
      <div class="pb-canvas-col">
        <h4>Ablauf — jeder Schritt bekommt das Ergebnis des vorherigen</h4>
        <div class="pb-canvas" id="pb-canvas"
          ondragover="pbCanvasOver(event)" ondrop="pbCanvasDrop(event)"
          ondragleave="pbCanvasLeave(event)"></div>
        <div class="pb-flow" id="pb-flow"></div>
      </div>
    </div>`,
    [{label: p?"Speichern":"Pipeline anlegen", primary:true,
      action:()=>builderSave(p)}]);
  const mod = document.getElementById("modal");
  if (mod) mod.classList.add("mo-wide");
  builderRender();
}

function builderRender() {
  const c = document.getElementById("pb-canvas");
  if (!c) return;
  c.innerHTML = builderSteps.length
    ? builderSteps.map((s,i)=>pbBlockHtml(s,i)).join(`<div class="pb-conn">↓</div>`)
    : `<div class="pb-empty">Ziehe links einen Baustein hierher — oder klicke ihn an.</div>`;
  const flow = document.getElementById("pb-flow");
  if (flow) flow.innerHTML = builderSteps.length
    ? "<b>Fluss:</b> " + builderSteps.map(s=>{
        const t = STEP_TYPES[s.type]||STEP_TYPES.agent;
        const m = s.model ? ` <code style="font-size:11px">${esc(s.model.split("@@").pop())}</code>` : "";
        return t.icon + " " + t.label + m;
      }).join(" → ")
    : "<b>Fluss:</b> noch leer";
}

function pbBlockHtml(step, i) {
  const v = STEP_TYPES[step.type] || STEP_TYPES.agent;
  let ref;
  if (v.src) {
    const list = state[v.src] || [];
    ref = `<select onchange="pbSet(${i},'ref_id',this.value)">${
      list.length ? list.map(o=>`<option value="${o.id}"${step.ref_id===o.id?" selected":""}>${esc((o.emoji?o.emoji+" ":"")+(o.name||o.title))}</option>`).join("")
                  : `<option value="">— nichts angelegt —</option>`}</select>`;
  } else {
    ref = `<span style="font-size:11.5px;color:var(--text-3)">${esc(v.hint)}</span>`;
  }
  return `<div class="pb-block" data-i="${i}"
      ondragover="pbBlockOver(event,${i})" ondrop="pbBlockDrop(event,${i})">
    <span class="pb-handle" draggable="true" title="Zum Umsortieren ziehen"
      ondragstart="pbBlockDrag(event,${i})" ondragend="pbDragEnd()">⠿</span>
    <span class="pb-num">${i+1}</span>
    <span class="pb-ico">${v.icon}</span>
    <div class="pb-body">
      <div class="pb-toprow">
        <select onchange="pbSet(${i},'type',this.value)">${
          Object.entries(STEP_TYPES).map(([k,tv])=>`<option value="${k}"${k===step.type?" selected":""}>${tv.icon} ${tv.label}</option>`).join("")}</select>
        ${ref}
        <select title="Modell nur für diesen Schritt — so laufen mehrere LLMs in einer Kette"
          onchange="pbSet(${i},'model',this.value)">
          <option value=""${!step.model?" selected":""}>🧩 Standardmodell</option>
          ${modelOptionsHtml(step.model||"")}</select>
      </div>
      <input class="pb-instr" placeholder="Anweisung für diesen Schritt (optional)"
        value="${esc(step.instruction||"")}" oninput="pbSet(${i},'instruction',this.value)">
    </div>
    <button class="pb-del" onclick="pbRemove(${i})" title="Baustein entfernen">✕</button>
  </div>`;
}

function pbSet(i, key, val) {
  if (!builderSteps[i]) return;
  builderSteps[i][key] = val;
  // Nur ein Typwechsel verändert die Darstellung; Ref/Anweisung still setzen,
  // damit der Eingabefokus beim Tippen erhalten bleibt.
  if (key === "type") { builderSteps[i].ref_id = ""; builderRender(); }
}
function pbAdd(type){ builderSteps.push(pbDefaultStep(type)); builderRender(); }
function pbRemove(i){ builderSteps.splice(i,1); builderRender(); }

/* --- Drag & Drop --- */
function pbPaletteDrag(e, type){ pbDragFrom = "new:"+type;
  e.dataTransfer.effectAllowed="copy"; e.dataTransfer.setData("text/plain","new"); }
function pbBlockDrag(e, i){ pbDragFrom = i;
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain","move");
  const b = e.target.closest(".pb-block"); if (b) b.classList.add("dragging"); }
function pbDragEnd(){ pbDragFrom = null;
  document.querySelectorAll(".pb-block.dragging").forEach(el=>el.classList.remove("dragging"));
  const c=document.getElementById("pb-canvas"); if(c) c.classList.remove("drop-hot"); }
function pbCanvasOver(e){ e.preventDefault();
  e.dataTransfer.dropEffect = (typeof pbDragFrom==="string")?"copy":"move";
  const c=document.getElementById("pb-canvas"); if(c) c.classList.add("drop-hot"); }
function pbCanvasLeave(e){ const c=document.getElementById("pb-canvas");
  if(c && !c.contains(e.relatedTarget)) c.classList.remove("drop-hot"); }
function pbCanvasDrop(e){ e.preventDefault(); pbDrop(builderSteps.length); }
function pbBlockOver(e, i){ e.preventDefault(); e.stopPropagation(); }
function pbBlockDrop(e, i){ e.preventDefault(); e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  pbDrop(after ? i+1 : i); }
function pbDrop(pos) {
  if (pbDragFrom === null) return;
  if (typeof pbDragFrom === "string" && pbDragFrom.startsWith("new:")) {
    builderSteps.splice(pos, 0, pbDefaultStep(pbDragFrom.slice(4)));
  } else {
    const from = pbDragFrom, step = builderSteps[from];
    if (!step) { pbDragEnd(); return; }
    builderSteps.splice(from, 1);
    if (from < pos) pos--;          // Index nach dem Entfernen korrigieren
    builderSteps.splice(pos, 0, step);
  }
  pbDragEnd();
  builderRender();
}

function pbLabelFor(s){
  const v = STEP_TYPES[s.type] || STEP_TYPES.agent;
  if (v.src){ const o=(state[v.src]||[]).find(x=>x.id===s.ref_id); if(o) return (o.name||o.title); }
  return v.label;
}
async function builderSave(p) {
  const name = document.getElementById("bp-name").value.trim();
  if (!name) { toast("Bitte einen Namen vergeben"); return; }
  if (!builderSteps.length) { toast("Mindestens ein Baustein nötig"); return; }
  const steps = builderSteps.map(s=>({
    type:s.type, ref_id:s.ref_id||"", agent_id: s.type==="agent"?(s.ref_id||""):"",
    model:s.model||"", label: pbLabelFor(s), instruction:s.instruction||""}));
  const body = JSON.stringify(
    {name, description: document.getElementById("bp-desc").value, steps});
  if (p) await api("/api/pipelines/"+p.id, {method:"PUT", body});
  else await api("/api/pipelines", {method:"POST", body});
  state.pipelines = await api("/api/pipelines");
  closeModal();
  toast("⛓️ Pipeline gespeichert");
  if (state.view === "pipelines") renderPipelines();
}

async function discordServerSpeichern(aktiv) {
  const konfig = {
    kanaele: [...document.querySelectorAll(".dcs-kanal:checked")].map(x => x.value),
    modus: (document.querySelector("input[name=dcs-modus]:checked") || {}).value || "oeffentlich",
    voll_nutzer: $("#dcs-voll").value.split(/[\s,;]+/).filter(Boolean),
    modelle: [...document.querySelectorAll(".dcs-modell:checked")].map(x => x.value),
    standard_modell: $("#dcs-standard").value, limit_stunde: parseInt($("#dcs-limit").value, 10) || 0,
    fusszeile: $("#dcs-fuss").checked, inhalt_lesen: $("#dcs-inhalt").checked,
    privat_threads: $("#dcs-privat").checked, original_entfernen: $("#dcs-entfernen").checked};
  try {
    await apiPost("/api/discord-server", {token: $("#dcs-token").value.trim(), konfig, projekt: $("#dcs-projekt").value, aktiv});
    dcsKanaele = null; toast(aktiv ? L("🎮 Discord-Server-Chat läuft", "🎮 Discord server chat is running") : L("Gespeichert", "Saved"));
    discordServerKarte();
  } catch(e) { toast(e.message); }
}

  if (el) el.innerHTML = cloud ? `<div class="warn-box" style="border-color:var(--red);background:var(--red-soft);color:var(--red)" data-roh>
    ☁️ <b>${L("Ab hier bleibt nichts mehr lokal.", "From here on, nothing stays local.")}</b> ${L("Alles, was du diesem Anbieter schickst — Fragen, Dateien, Wissen, Code —, geht an", "Everything you send to this provider — questions, files, knowledge, code — goes to")} <code>${esc((url.match(/^https?:\/\/([^\/]+)/) || [,url])[1])}</code>.
    ${L("Seine Modelle sind in jeder Auswahl mit ☁️ markiert. Für 100 % lokal: keinen Cloud-Anbieter eintragen.", "Its models are marked ☁️ in every picker. For 100 % local: don’t add a cloud provider.")}</div>` : "";

}

/* Der Lotse hilft: Er zeigt, was gerade klemmt, schlägt passende Fragen vor und hängt an Antworten Knöpfe, die die
   Sache erledigen (07.10.2026: vorher bat er den Nutzer, Antworten auf offene Fragen selbst einzutragen). Welche
   Knöpfe es gibt, steht nur hier — der Server nennt nur Schlüssel, das Modell erfindet keine. */
const PROJEKT_URL = "https://github.com/daiams2000-hash/dive-on-wide";   /* bei einem Kontowechsel hier anpassen */
const LOTSE_AKTIONEN = {
  provider: () => einstellungZeigen("Modelle & Provider", () => lokaleServerSuchen()),
  modelle: () => show("modelle"),
  chat: () => erklaerStart(),
  wissen: () => show("knowledge"),

function lotseAktion(schluessel) {
  closeModal();
  if (schluessel.startsWith("laden:")) {
    const tag = schluessel.slice(6);
    apiPost("/api/modelle/laden", {tag}).then(() => toast("⬇️ " + L("Lädt im Hintergrund: ", "Downloading in the background: ") + tag))
      .catch(e => toast(e.message));
    show("modelle"); return;
  }
  if (schluessel.startsWith("einstellung:")) { einstellungZeigen(schluessel.slice(12)); return; }
  if (schluessel.startsWith("standard:")) {
    const kurz = schluessel.slice(9), m = (state.models || []).find(x => x.label === kurz || x.name.endsWith("@@" + kurz));
    apiPost("/api/settings", {DEFAULT_MODEL: m ? m.name : kurz})
      .then(() => { state.defaultModel = m ? m.name : kurz; fillModelSelect(); toast("✅ " + L("Standardmodell: ", "Default model: ") + kurz); })
      .catch(e => toast(e.message));
    return;
  }
  if (schluessel === "melden") {
    const frage = (lotseVerlauf.filter(n => n.role === "user").pop() || {}).content || "";
    window.open(PROJEKT_URL + "/issues/new?title=" + encodeURIComponent(L("Frage: ", "Question: ") + frage.slice(0, 120)), "_blank", "noopener");
    return;
  }
  (LOTSE_AKTIONEN[schluessel] || (() => toast(schluessel)))();
}
/* Zu einer Karte in den Einstellungen springen und sie kurz hervorheben. */
function einstellungZeigen(titel, danach) {
  show("settings");

  const suchen = () => {
    const h = [...document.querySelectorAll(".settings-card h3")].find(x => x.textContent.includes(titel));
    if (h) {
      const karte = h.closest(".settings-card");
      karte.scrollIntoView({behavior: "smooth", block: "start"});
      karte.classList.add("hervor"); setTimeout(() => karte.classList.remove("hervor"), 2200);
      if (danach) danach();
    } else if (Date.now() < ende) setTimeout(suchen, 120);
  };
  setTimeout(suchen, 100);
}

  const feld = $("#lotse-frage"), frage = (feld && feld.value || "").trim();
  if (!frage) return;
  const vorher = lotseVerlauf.slice(-6).map(n => ({role: n.role, content: n.content}));
  lotseVerlauf.push({role: "user", content: frage});
  feld.value = ""; feld.disabled = true;
  const chat = $("#lotse-chat");
  chat.innerHTML = lotseVerlaufHtml() + `<div style="color:var(--text-3)" data-roh>${L("🧭 denkt nach …", "🧭 thinking …")}</div>`;
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await apiPost("/api/lotse", {frage, verlauf: vorher, sprache: SPRACHE.code});
    lotseVerlauf.push({role: "assistant", content: r.antwort, quellen: r.quellen, aktionen: r.aktionen});
  } catch(e) { lotseVerlauf.push({role: "assistant", content: "⚠️ " + e.message}); }
  const c = $("#lotse-chat"); if (!c) return;
  c.innerHTML = lotseVerlaufHtml(); c.scrollTop = c.scrollHeight;
  const f = $("#lotse-frage"); if (f) { f.disabled = false; f.focus(); }
}
function openModal(title, bodyHtml, buttons=[]) {
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = bodyHtml;
  $("#modal-foot").innerHTML = "";
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "btn " + (b.primary ? "btn-primary" : "btn-ghost");
    btn.textContent = b.label;
    btn.onclick = b.action;
    $("#modal-foot").appendChild(btn);
  });
  if (!buttons.length) $("#modal-foot").style.display = "none";
  else $("#modal-foot").style.display = "flex";
  $("#modal-bg").classList.add("open");
}
function closeModal(){ $("#modal-bg").classList.remove("open");
  const mod = document.getElementById("modal"); if (mod) mod.classList.remove("mo-wide"); }
async function delItem(table, id, rerender) {
  if (!confirm("Wirklich löschen?")) return;
  await api("/api/"+table+"/"+id, {method:"DELETE"});
  rerender();
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function bootData() {
  const [models, agents, prompts, skills, knowledge] = await Promise.all([
    api("/api/models"), api("/api/agents"), api("/api/prompts"),
    api("/api/skills"), api("/api/knowledge")]);
  state.models = models.models; state.defaultModel = models.default;
  state.agents = agents; state.prompts = prompts;
  state.skills = skills; state.knowledge = knowledge;
}
async function checkHealth() {
  try {
    const h = await api("/api/health");
    if (h.eingeschraenkt) {
      // Ohne Schluessel gibt der Server nur „lebt" heraus. Das ist Absicht —
      // aber dann darf hier auch nicht mehr behauptet werden, als bekannt ist.
      $("#status-dot").style.background = "var(--text-3)";
      $("#status-text").textContent = "Zugangsschlüssel nötig";
      return setTimeout(checkHealth, 20000);
    }
    $("#status-dot").style.background = h.ok ? "var(--green)" : "var(--red)";
    $("#status-text").textContent = h.ok
      ? "Ollama verbunden (" + h.models + " Modelle)" : "Ollama nicht erreichbar";
  } catch(_) {
    $("#status-dot").style.background = "var(--red)";
    $("#status-text").textContent = "Backend nicht erreichbar";
  }
  setTimeout(checkHealth, 20000);
}
/* Dienstarbeiter anmelden — damit Dive on Wide auf dem Handy zum Startbildschirm
   hinzugefuegt werden kann und wie eine App startet. Er speichert
   ausschliesslich die Huelle zwischen, niemals Inhalte. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(e => {
      /* Kein Alarm: Dive on Wide laeuft ohne Dienstarbeiter vollstaendig. Aber auch
         kein Schweigen — ein leeres catch() haette hier tagelang einen Fehler
         verborgen, den die Browserkonsole ohnehin anzeigt. */
      console.info("Dienstarbeiter nicht angemeldet (" + (e && e.message ? e.message : e) +
                   "). Dive on Wide funktioniert normal; nur das Hinzufuegen zum " +
                   "Startbildschirm verhaelt sich wie eine gewoehnliche Webseite.");
    });
  });
}

(async function init() {
  applyTheme(themeNow());
  await spracheStarten();
  await einrichtungPruefen();   /* zeigt sich nur beim allerersten Start */
  try { await bootData(); } catch(e) { toast("Fehler beim Laden: " + e.message); }
  loadSessions();
  /* Steht eine Ansicht in der Adresse, gilt sie — sonst das Dashboard. */
  const gemeint = sitzungAusAdresse();
  /* NICHT gegen state.sessions prüfen: loadSessions() läuft ohne await, die
     Liste ist hier also noch leer, und die Unterhaltung wurde nie geöffnet.
     Stattdessen einfach versuchen — openSession holt den Verlauf ohnehin vom
     Server, und wenn die Kennung nicht stimmt, greift der Rückfall. */
  let geoeffnet = false;
  if (gemeint) {
    try { await openSession(gemeint); geoeffnet = true; } catch (e) {}
  }
  lotseKnopf();
  if (!geoeffnet && !(!ansichtAusAdresse() && await erstStart())) show(ansichtAusAdresse() || "dashboard", true);
  checkHealth();
  pollNotifications();
})();

document.documentElement.dataset.skript = "geladen";
</script>
