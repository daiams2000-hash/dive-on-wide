<title>Dive on Wide Alpha 0.5.1</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Dive on Wide — Designsystem „Dive on Wide"

   Dive on Wide ist die Kurzform von Dive on Wide. Der Name ist ein Auftrag:
   neugierig bleiben und immer tiefer in eine Sache hineintauchen.
   Genau das ist auch das Farbsystem.

   Alle Farben stammen aus zwei Werten des Logos — der Tinte (#3E5670)
   und dem Papier (#E8D7BF). Daraus entstehen zwei Rampen:

     DIE TIEFE (--depth-*)     kühl, wird nach unten dunkler und dichter.
                               Trägt Struktur, Text und die Primärfarbe.
     DIE OBERFLÄCHE (--sand-*) warm, das Licht von oben.
                               Trägt Flächen, Ruhe und Akzente.

   Regel: Ein Element sitzt umso tiefer in der Rampe, je „weiter unten"
   es in der Aufmerksamkeit liegt. Nie eine Farbe außerhalb der Rampen.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* --- Die Tiefe: Oberfläche → Abgrund ------------------------------- */
  --depth-0:#f2f6fa; --depth-1:#e2eaf2; --depth-2:#c4d3e1;
  --depth-3:#9aaec3; --depth-4:#6b85a0; --depth-5:#3e5670;  /* Logo-Tinte */
  --depth-6:#2c4055; --depth-7:#1b2a3a; --depth-8:#101b26;  /* Abgrund   */

  /* --- Die Oberfläche: Licht von oben, das Papier des Logos ---------- */
  --sand-0:#fcfaf6; --sand-1:#f5f1e8; --sand-2:#ede6d8;
  --sand-3:#e8d7bf;  /* Logo-Papier */ --sand-4:#cdaf83; --sand-5:#9a7a4b;

  /* --- Rollen (nur diese im restlichen CSS benutzen) ----------------- */
  --bg:var(--sand-0); --bg-soft:var(--sand-1); --bg-hover:var(--sand-2);
  --border:#e0d8c8; --border-soft:#efeae0;
  --text:var(--depth-7); --text-2:#4e6076; --text-3:#7a8797;
  --primary:var(--depth-5); --primary-hover:var(--depth-6); --primary-soft:#e6ecf3;
  --primary-ring:rgba(62,86,112,.16);
  --on-primary:var(--sand-0);          /* Text auf der Primärfläche */
  --on-deep:var(--depth-1);            /* Text auf dunklem Grund    */

  /* --- Signale, auf die Palette abgestimmt --------------------------- */
  --green:#2f7d6b; --green-soft:#dcede7; --green-ink:#1f5c4e;
  --red:#b4483d;   --red-soft:#f6e3e0;  --red-ink:#8e362d;
  --amber:#b5803a; --amber-soft:#f6ebd8;--amber-ink:#7a5420;

  /* --- Code: immer der Abgrund -------------------------------------- */
  --code-bg:var(--depth-8); --code-head:var(--depth-7);
  --code-text:var(--depth-2); --code-dim:var(--depth-3);
  --console-ok:#5fc9a8; --console-bad:#e08a7e;

  --radius:12px; --radius-lg:16px;
  --shadow:0 1px 3px rgba(27,42,58,.07),0 1px 2px rgba(27,42,58,.05);
  --shadow-lg:0 10px 30px rgba(27,42,58,.16);
  --sidebar-w:250px;
  color-scheme:light;
}

/* ═══ „Die Tiefe" — dunkles Thema ═══════════════════════════════════════
   Kein invertiertes Hellthema, sondern derselbe Tauchgang weiter unten:
   der Hintergrund ist der Abgrund, das Licht von oben (Sand) wird zum
   Akzent, und die Primärfarbe hellt auf, wie eine Lampe unter Wasser.  */
:root[data-theme="deep"]{
  --bg:var(--depth-8); --bg-soft:#14202c; --bg-hover:#1d2c3b;
  --border:#26374a; --border-soft:#1b2937;
  --text:#dce6ef; --text-2:var(--depth-3); --text-3:var(--depth-4);
  --primary:#7fa0c0; --primary-hover:#9db8d2; --primary-soft:#1b2e42;
  --primary-ring:rgba(127,160,192,.22);
  --on-primary:var(--depth-8);
  --green:#4fae95; --green-soft:#14302a; --green-ink:#8fd6c0;
  --red:#d97b6e;   --red-soft:#331d1a;   --red-ink:#f0a99e;
  --amber:#d3a460; --amber-soft:#312614; --amber-ink:#e8c78f;
  --code-bg:#0a1219; --code-head:#14202c;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 34px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--depth-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ---------- Sidebar ---------- */
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
/* Die Marke: der Taucher aus dem Logo, abtauchend in die Tiefe. */
.brand-logo{width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(155deg,var(--depth-4),var(--depth-7));
  color:var(--sand-0);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-logo .mark{width:21px;height:21px;display:block}
.theme-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border-radius:9px;color:var(--text-2);font-weight:500;text-align:left}
.theme-toggle:hover{background:var(--bg-hover);color:var(--text)}
.brand-name{font-weight:700;font-size:16px}
.brand-beta{font-size:9px;letter-spacing:.08em;color:var(--text-3);border:1px solid var(--border);
  border-radius:5px;padding:1px 5px;margin-left:2px}
.new-chat-btn{display:flex;align-items:center;gap:8px;width:100%;background:var(--primary);
  color:var(--on-primary);border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:14px;
  transition:background .15s}
.new-chat-btn:hover{background:var(--primary-hover)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;
  color:var(--text-2);font-weight:500;margin-bottom:2px;text-align:left;position:relative}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--bg-hover);color:var(--text);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:15px}
.nav-sub{margin-left:14px;border-left:1px solid var(--border-soft);padding-left:6px}
.nav-badge{position:absolute;right:10px;background:var(--red);color:var(--sand-0);font-size:10px;
  font-weight:700;border-radius:9px;min-width:17px;height:17px;display:flex;
  align-items:center;justify-content:center;padding:0 4px}
.side-section{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em;
  text-transform:uppercase;padding:14px 10px 6px}
/* Seitenleiste: Menue und Verlauf teilen sich EINEN Scrollbereich.
   Vorher war das Menue ein starres Flex-Element von 867 px Hoehe; in
   einem 868-px-Fenster schob es Verlauf, Einstellungen und Chat aus dem
   Bild, und die ganze Seite verrutschte. Ein Laptopdeckel reicht dafuer
   aus — gefunden beim Frischklon-Durchgang am 22.09.2026. */
.side-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#chat-list{min-height:40px}
.chat-item{display:flex;align-items:center;width:100%;padding:7px 10px;border-radius:8px;
  color:var(--text-2);text-align:left;position:relative}
.chat-item:hover{background:var(--bg-hover)}
.chat-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del{opacity:0;color:var(--text-3);padding:2px 5px;border-radius:5px}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{color:var(--red);background:var(--red-soft)}
.side-footer{border-top:1px solid var(--border-soft);padding-top:10px;margin-top:8px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.status-line{display:flex;align-items:center;padding:7px 10px;font-size:12px;color:var(--text-3)}

/* ---------- Topbar / Views ---------- */
#view{flex:1;overflow-y:auto}
.view-pad{max-width:1100px;margin:0 auto;padding:34px 40px 60px}
.view-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.view-head .vh-ico{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;font-size:24px}
.view-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.view-head p{color:var(--text-2);margin-top:5px;max-width:640px;line-height:1.5}
.view-head .vh-actions{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 14px;
  font-weight:600;transition:all .15s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--red-soft);color:var(--red-ink)}

/* ---------- Cards / Grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);
  transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card .c-top{display:flex;align-items:center;gap:10px}
.card .c-emoji{width:40px;height:40px;border-radius:11px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.card h3{font-size:15px;font-weight:700}
.card .c-desc{color:var(--text-2);font-size:13px;line-height:1.5;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .c-foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-gray{background:var(--bg-hover);color:var(--text-2)}
.badge-green{background:var(--green-soft);color:var(--green-ink)}
.empty-state{border:1px solid var(--border);border-radius:var(--radius-lg);padding:60px 20px;
  text-align:center;color:var(--text-3)}
.empty-state .big{font-size:36px;margin-bottom:10px}
.empty-state h3{color:var(--text-2);font-weight:600;margin-bottom:4px;font-size:16px}

/* ---------- Chat ---------- */
#chat-view{display:flex;flex-direction:column;height:100%;
  background:radial-gradient(120% 60% at 50% 0%, var(--bg-soft), var(--bg) 70%)}
/* Startkarten: der Einstieg — eine Karte führt (Orchestrator), die anderen sind ruhig. */
.start-karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;
  max-width:760px;margin:30px auto 0;text-align:left}
.start-karte{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--border);
  border-radius:var(--radius-lg);background:var(--bg);transition:border-color .15s,box-shadow .15s,transform .15s}
.start-karte:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px)}
.start-karte.haupt{border-color:var(--primary);background:var(--primary-soft)}
.start-karte .sk-ico{font-size:20px}
.start-karte b{font-size:14px}
.start-karte small{color:var(--text-3);font-size:12.5px;line-height:1.4}
/* Modus der Eingabe: Chat · Orchestrator · Werkbank */
.modus-wahl{display:flex;gap:2px;padding:6px 8px 0}
.modus-wahl button{font-size:12.5px;padding:5px 11px;border-radius:999px;color:var(--text-3)}
.modus-wahl button:hover{color:var(--text);background:var(--bg-hover)}
.modus-wahl button.an{color:var(--on-primary);background:var(--primary)}
/* Die Werkbank als Leiste, die aus der Eingabezeile hochfährt — passt immer ins Fenster. */
.wb-leiste{max-width:820px;margin:0 auto 8px;background:var(--bg);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  max-height:min(62vh,600px);max-height:min(62dvh,600px);overflow:hidden;
  transform:translateY(16px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.wb-leiste.offen{transform:none;opacity:1}
.wl-griff{height:14px;cursor:ns-resize;touch-action:none;position:relative;flex-shrink:0}
.wl-griff::after{content:"";position:absolute;left:50%;top:5px;width:44px;height:4px;margin-left:-22px;
  border-radius:4px;background:var(--depth-2)}
.wl-kopf{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px}
.wl-inhalt{overflow-y:auto;padding:4px 16px 8px;min-height:0;flex:1}
.wl-fuss{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:10px 16px;
  border-top:1px solid var(--border-soft)}
.wl-fuss .btn-primary{order:99;margin-left:auto}
.wl-fuss{justify-content:flex-start;align-items:center}
.wl-fuss .btn-ghost{font-size:12px;padding:5px 9px;color:var(--text-3)}
body[data-ansicht="chat"] #lotse-knopf{bottom:calc(120px + env(safe-area-inset-bottom, 0px)) !important;
  width:42px !important;height:42px !important;font-size:19px !important;opacity:.85}
.wl-mehr{position:relative}
.wl-mehr summary{list-style:none;cursor:pointer}
.wl-mehr summary::-webkit-details-marker{display:none}
.wl-mehr-liste{position:absolute;bottom:calc(100% + 6px);left:0;display:flex;flex-direction:column;gap:2px;
  background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:5;min-width:170px}
.wl-mehr-liste .btn{justify-content:flex-start;width:100%}
@media (max-width: 860px){ body[data-ansicht="chat"] #lotse-knopf{top:8px !important;bottom:auto !important;right:10px !important} }
@media (min-width: 1100px){ .start-karten{grid-template-columns:repeat(4,1fr);max-width:920px} }
@media (min-width: 521px) and (max-width: 1099px){ .start-karten{grid-template-columns:repeat(2,1fr);max-width:620px} }
.wl-kopf .mo-close{color:var(--text-3);font-size:17px;padding:2px 8px;border-radius:8px}
.wl-kopf .mo-close:hover{background:var(--bg-hover)}
#chat-scroll{flex:1;overflow-y:auto}
.chat-inner{max-width:820px;margin:0 auto;padding:30px 24px 20px}
.hero{text-align:center;padding-top:9vh}
/* Der Taucher über der Begrüßung: hier beginnt der Tauchgang. */
.hero-mark{width:56px;height:56px;margin:0 auto 18px;color:var(--depth-4);opacity:.9}
.hero-mark svg{width:100%;height:100%;display:block}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--text-2);margin-top:10px;font-size:15px}
.hero-chips{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;
  padding:9px 18px;font-weight:600;color:var(--text-2);background:var(--bg)}
.chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.hero-suggestions{max-width:640px;margin:30px auto 0;text-align:left}
.sugg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 16px;
  border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;color:var(--text-2);
  background:var(--bg)}
.sugg:hover{border-color:var(--border);box-shadow:var(--shadow)}
.msg{display:flex;gap:12px;margin-bottom:22px}
.msg .avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:700}
.msg.user .avatar{background:var(--depth-6);color:var(--on-primary)}
.msg.assistant .avatar{background:var(--primary-soft);color:var(--primary)}
.msg .m-body{flex:1;min-width:0}
.msg .m-name{font-weight:700;font-size:13px;margin-bottom:4px}
.msg .m-name small{color:var(--text-3);font-weight:500;margin-left:6px}
.m-content{line-height:1.65;word-wrap:break-word}
.m-content p{margin-bottom:10px}
.m-content h1,.m-content h2,.m-content h3{margin:14px 0 8px;line-height:1.3}
.m-content h1{font-size:20px}.m-content h2{font-size:17px}.m-content h3{font-size:15px}
.m-content ul,.m-content ol{margin:0 0 10px 22px}
.m-content li{margin-bottom:3px}
.m-content code{background:var(--bg-hover);border-radius:5px;padding:1px 6px;
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.m-content table{border-collapse:collapse;margin:10px 0;font-size:13px}
.m-content th,.m-content td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.m-content th{background:var(--bg-soft)}
.m-content blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--text-2);margin:10px 0}
.codeblock{background:var(--code-bg);border-radius:12px;margin:12px 0;overflow:hidden}
.codeblock .cb-head{display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;background:var(--code-head);color:var(--code-dim);font-size:12px}
.codeblock .cb-head button{color:var(--code-dim);font-size:12px;padding:3px 8px;border-radius:6px}
.codeblock .cb-head button:hover{background:var(--depth-6);color:var(--on-deep)}
.codeblock pre{padding:14px;overflow-x:auto;color:var(--code-text);
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
.wissen-ablage{border:2px dashed var(--border);border-radius:14px;padding:18px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.wissen-ablage.heiss{border-color:var(--primary);background:var(--primary-soft)}
.bib-leiste{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px;margin:0 0 18px}
.bib-art{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--border-soft);
  border-radius:var(--radius);background:var(--bg-soft)}
.bib-art:hover{border-color:var(--border)}
.bib-art.an{border-color:var(--primary);background:var(--primary-soft)}
.bib-art b{font-size:13px}
.bib-art small{font-size:12px;color:var(--text-3);line-height:1.35}
.lotse-problem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.lotse-schritte{margin-bottom:10px;border:1px solid var(--border-soft);border-radius:var(--radius);padding:8px 12px}
.lotse-schritte summary{cursor:pointer;font-weight:700}
.lotse-schritt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border-soft)}
.lotse-schritt small{color:var(--text-3)}
.lotse-vorschlaege{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lotse-vorschlaege .chip{font-size:12.5px;padding:5px 11px}
.lotse-frage-zeile{margin:10px 0 4px auto;max-width:85%;width:fit-content;background:var(--primary-soft);color:var(--text);
  padding:7px 11px;border-radius:12px}
.lotse-antwort{margin:4px 0 10px}
.lotse-knoepfe{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lotse-quellen{margin-top:6px;font-size:12px;color:var(--text-3)}
.lotse-quellen summary{cursor:pointer}
.settings-card.hervor{box-shadow:0 0 0 3px var(--primary-ring);border-color:var(--primary) !important;transition:box-shadow .3s}
.m-wissen{margin-top:6px;font-size:12px;color:var(--text-3)}
.sysnote{background:var(--primary-soft);border:1px solid var(--depth-2);color:var(--primary);
  border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}
.m-actions{display:flex;gap:6px;margin-top:8px}
.m-actions button{font-size:12px;color:var(--text-3);padding:4px 9px;border-radius:7px;
  border:1px solid var(--border-soft)}
.m-actions button:hover{color:var(--text);background:var(--bg-hover)}
.typing{display:inline-block;color:var(--text-3)}
.typing::after{content:"▍";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- Composer ---------- */
#composer-wrap{padding:10px 24px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
#composer{max-width:820px;margin:0 auto;border:1px solid var(--border);border-radius:16px;
  background:var(--bg);box-shadow:var(--shadow);position:relative}
#composer:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
#input{width:100%;border:none;outline:none;resize:none;padding:14px 16px 6px;
  max-height:180px;line-height:1.5;background:transparent}
.composer-bar{display:flex;align-items:center;gap:8px;padding:6px 10px 10px}
.composer-bar select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;
  color:var(--text-2);background:var(--bg);font-size:12.5px;max-width:190px}
.send-btn{margin-left:auto;width:34px;height:34px;border-radius:9px;background:var(--primary);
  color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:15px}
.send-btn:disabled{background:var(--depth-3);cursor:default}
.composer-hint{max-width:820px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--text-3)}
#autocomplete{position:absolute;bottom:100%;left:12px;right:12px;margin-bottom:8px;
  background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  max-height:260px;overflow-y:auto;display:none;z-index:50}
.ac-head{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.05em;padding:10px 14px 4px}
.ac-item{display:flex;flex-direction:column;width:100%;text-align:left;padding:8px 14px;gap:1px}
.ac-item:hover,.ac-item.sel{background:var(--primary-soft)}
.ac-item b{font-size:13px}
.ac-item small{color:var(--text-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Inbox ---------- */
.notif{display:flex;gap:13px;border:1px solid var(--border);border-radius:14px;padding:16px;
  margin-bottom:10px;background:var(--bg)}
.notif.unread{border-color:var(--depth-2);background:var(--primary-soft)}
.notif .n-ico{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.notif h4{font-size:14px;font-weight:700;margin-bottom:3px}
.notif p{color:var(--text-2);font-size:13px;line-height:1.5}
.notif .n-time{color:var(--text-3);font-size:12px;margin-top:5px}
.notif .n-side{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* ---------- Listen (Skills etc.) ---------- */
.list-row{display:flex;align-items:center;gap:14px;border:1px solid var(--border);
  border-radius:14px;padding:16px 18px;margin-bottom:10px;background:var(--bg)}
.list-row .l-ico{width:40px;height:40px;border-radius:11px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.list-row .l-main{flex:1;min-width:0}
.list-row h4{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.list-row p{color:var(--text-2);font-size:13px;margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.list-row .l-actions{display:flex;gap:7px}

/* ---------- Modal ---------- */
#modal-bg{position:fixed;inset:0;background:rgba(16,27,38,.55);display:none;
  align-items:center;justify-content:center;z-index:100;padding:12px}
#modal-bg.open{display:flex}
#modal{background:var(--bg);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;
  max-width:620px;max-height:92vh;max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow:hidden}
/* Fenster mit viel Inhalt bekommen die Breite, die da ist — statt zu scrollen (07.10.2026, Windows-Test:
   Werkzeugwahl musste man scrollen, der Pipeline-Bau lief seitlich aus dem Bild). */
#modal:has(.tool-grid), #modal:has(.pb-wrap), #modal:has(#wb-ws) { max-width: min(980px, calc(100vw - 24px)); }
#modal .mo-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border-soft)}
#modal .mo-head h2{font-size:17px;font-weight:800;flex:1}
#modal .mo-close{color:var(--text-3);font-size:19px;padding:4px 9px;border-radius:8px}
#modal .mo-close:hover{background:var(--bg-hover)}
#modal .mo-body{padding:20px 22px;overflow-y:auto}
#modal .mo-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;
  border-top:1px solid var(--border-soft)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--text-2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);
  border-radius:9px;padding:9px 12px;outline:none;background:var(--bg)}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.step-box{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;
  background:var(--bg-soft)}
.step-box .s-head{display:flex;align-items:center;margin-bottom:8px;font-weight:700;font-size:13px}
.step-box .s-head button{margin-left:auto;color:var(--red);font-size:12px}

/* ---------- Settings ---------- */
.settings-card{border:1px solid var(--border);border-radius:16px;padding:22px;max-width:620px;
  margin-bottom:16px}
.settings-card h3{font-size:15px;font-weight:700;margin-bottom:14px}
.health-ok{color:var(--green);font-weight:600}
.health-bad{color:var(--red);font-weight:600}
.cu-check{border:1px solid var(--border-soft);border-radius:10px;padding:8px 12px;
  margin-bottom:10px;background:var(--bg-soft)}
.cu-line{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px}
.cu-line.ok .cu-dot{color:var(--green)}
.cu-line.bad .cu-dot{color:var(--red)}
.cu-line .cu-hint{margin-left:auto;color:var(--text-3);font-size:12px;text-align:right}
/* Netzwerk: der Compute-Zaehler ist die Hauptaussage der Ansicht. */
.mesh-zahl{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;
  color:var(--primary)}
.mesh-zahl small{font-size:20px;font-weight:600;color:var(--text-2);margin-left:6px}
.mesh-kachel{border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:22px;background:var(--bg);margin-bottom:14px}
.mesh-art{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.mesh-art button{flex:1;min-width:220px;text-align:left;border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;background:var(--bg);color:var(--text)}
.mesh-art button:hover{border-color:var(--primary);background:var(--primary-soft)}
.mesh-art button.aktiv{border-color:var(--primary);background:var(--primary-soft)}
.mesh-art b{display:block;margin-bottom:3px}
.mesh-art span{font-size:12.5px;color:var(--text-2)}
.mesh-geraet{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border-soft);font-size:13.5px}
.mesh-geraet .g-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--text-2)}
.mesh-geraet .g-gb{margin-left:auto;font-weight:700}
/* Bote: zwei Spalten — Kontakte links, Verlauf rechts. */
.bote{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bote-liste{width:280px;flex:none}
.bote-raum{flex:1;min-width:320px;display:flex;flex-direction:column;
  height:min(64vh,560px)}
.bote-k{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;
  border-radius:11px;border:1px solid var(--border-soft);margin-bottom:7px;
  background:var(--bg);text-align:left;color:var(--text)}
.bote-k:hover{border-color:var(--primary)}
.bote-k.aktiv{border-color:var(--primary);background:var(--primary-soft)}
.bote-k .punkt{width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--text-3)}
.bote-k.on .punkt{background:var(--green)}
.bote-k .n{font-weight:600;flex:1}
.bote-k .z{font-size:11px;color:var(--text-3)}
.bote-verlauf{flex:1;overflow-y:auto;padding:14px;border:1px solid var(--border);
  border-radius:var(--radius-lg);background:var(--bg-soft)}
.blase{max-width:74%;padding:9px 13px;border-radius:14px;margin-bottom:9px;
  font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.blase.ein{background:var(--bg);border:1px solid var(--border)}
.blase.aus{background:var(--primary);color:var(--on-primary);margin-left:auto}
.blase .t{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.bote-eingabe{display:flex;gap:8px;margin-top:10px}
.bote-eingabe input{flex:1;border:1px solid var(--border);border-radius:11px;
  padding:11px 13px;background:var(--bg);color:var(--text)}
.bote-eingabe input:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-ring)}
.anker-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;
  letter-spacing:.06em;background:var(--bg-soft);border:1px dashed var(--border);
  border-radius:12px;padding:14px;text-align:center;user-select:all;margin:10px 0}
.sz-zahl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
  letter-spacing:.05em;color:var(--text-2)}
/* QR: immer auf Weiss, auch im dunklen Thema — sonst liest ihn keine Kamera. */
.qr-feld{background:#fff;padding:10px;border-radius:12px;max-width:280px;
  margin:12px auto 6px}
.qr-feld svg{width:100%;height:auto;display:block}
/* Rhythmus: die naechste Ausfuehrung ist die wichtigste Angabe der Zeile. */
.takt{display:flex;align-items:center;gap:12px;border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--bg)}
.takt.aus{opacity:.55}
.takt .t-ico{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.takt .t-name{font-weight:600}
.takt .t-wann{font-size:12.5px;color:var(--text-2)}
.takt .t-naechst{margin-left:auto;text-align:right;font-size:12.5px;
  color:var(--text-2);white-space:nowrap}
.takt .t-naechst b{display:block;color:var(--text);font-size:13.5px}
.takt .t-knopf{display:flex;gap:6px;flex:none}
/* Einrichtung: ein Bildschirm, der einmal erscheint und dann nie wieder. */
#einr{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;
  display:flex;justify-content:center}
#einr .inner{max-width:660px;width:100%;padding:40px 22px 70px}
#einr h1{font-size:30px;letter-spacing:-.02em;margin-bottom:6px}
#einr .lead{color:var(--text-2);margin-bottom:26px;line-height:1.55}
#einr .karte{border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;margin-bottom:16px;background:var(--bg)}
#einr .karte h3{font-size:16px;margin-bottom:4px}
#einr .karte p.h{color:var(--text-2);font-size:13.5px;margin-bottom:12px;line-height:1.5}
.schalter{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
  border-top:1px solid var(--border-soft)}
.schalter:first-of-type{border-top:none}
.schalter input{margin-top:3px;flex:none;width:17px;height:17px}
.schalter b{display:block;font-size:14px}
.schalter span{font-size:12.5px;color:var(--text-2);line-height:1.5}
.schalter .warn{color:var(--amber-ink)}
/* Forum: Faeden verschwinden von selbst — die Restzeit gehoert sichtbar dazu. */
.faden{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;
  margin-bottom:11px;background:var(--bg);cursor:pointer}
.faden:hover{border-color:var(--primary)}
.faden h4{font-size:15.5px;margin-bottom:5px}
.faden .meta{font-size:12px;color:var(--text-3);display:flex;gap:12px;flex-wrap:wrap}
.faden.zu{opacity:.62}
.rest{font-variant-numeric:tabular-nums}
.rest.knapp{color:var(--amber-ink);font-weight:600}
.beitrag{border-left:3px solid var(--border);padding:9px 0 9px 13px;margin-bottom:11px}
.beitrag.eroeffner{border-left-color:var(--primary)}
.beitrag .wer{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:var(--text-3);margin-bottom:3px}
.beitrag .txt{white-space:pre-wrap;font-size:14px;line-height:1.5}
/* Modelle: die drei Wege, ein Modell zu fahren — sichtbar getrennt. */
.weg{border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;
  margin-bottom:14px;background:var(--bg)}
.weg > h3{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.weg > p.was{color:var(--text-2);font-size:13.5px;margin-bottom:12px}
.modell{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--border-soft);font-size:13.5px}
.modell:last-child{border-bottom:none}
.modell .mn{font-family:ui-monospace,Menlo,monospace}
.modell .mw{margin-left:auto;color:var(--text-3);font-size:12px}
.erg{border:1px solid var(--border-soft);border-radius:12px;padding:12px 14px;
  margin-bottom:10px;background:var(--bg-soft)}
.erg .von{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:var(--text-3);margin-bottom:5px}
.erg .txt{white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.erg.fehler{border-color:var(--red);background:var(--red-soft)}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:24px;right:24px;background:var(--depth-7);color:var(--on-deep);border-radius:12px;
  padding:12px 18px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;
  transform:translateY(10px);transition:all .25s;z-index:200;pointer-events:none;max-width:340px}
#toast.show{opacity:1;transform:none}
/* ---------- Modus-Leiste & Live-Läufe im Chat ---------- */
#mode-strip{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}
#mode-strip:not(:empty){padding:10px 12px 0}
.mode-pill{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);
  color:var(--primary);border:1px solid var(--depth-2);border-radius:999px;padding:4px 10px;
  font-size:12px;font-weight:600}
.mode-pill button{color:var(--primary);opacity:.6;font-size:13px;line-height:1;padding:0 2px}
.mode-pill button:hover{opacity:1}
.run-card{border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:12px;padding:14px 16px;margin-bottom:18px;background:var(--bg-soft)}
.run-card h4{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.run-card .r-steps{margin-top:8px;font-size:12.5px;color:var(--text-2)}
.run-card .r-steps div{padding:2px 0}
.run-card.done{border-left-color:var(--green)}
.run-card.error{border-left-color:var(--red)}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.tool-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;background:var(--bg)}
.tool-btn:hover{border-color:var(--primary);background:var(--primary-soft)}
.tool-btn b{font-size:13.5px}
.tool-btn small{color:var(--text-3);font-size:12px;line-height:1.4}
/* ---- Drag-&-Drop Pipeline-Builder ---- */
#modal.mo-wide{max-width:900px}
.pb-wrap{display:flex;gap:16px;flex-wrap:wrap}
.pb-wrap>*{min-width:0}
.pb-palette{flex:0 0 190px;min-width:170px}
.pb-palette h4,.pb-canvas-col h4{font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;color:var(--text-3);margin-bottom:9px}
.pb-canvas-col{flex:1 1 280px;min-width:min(280px,100%)}
.step-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:10px;padding:9px 11px;background:var(--bg);font-size:13px;font-weight:600;
  margin-bottom:7px;cursor:grab;width:100%;text-align:left;transition:border-color .12s,background .12s}
.step-chip:hover{border-color:var(--primary);background:var(--primary-soft)}
.step-chip:active{cursor:grabbing}
.step-chip .sc-ico{font-size:16px;width:20px;text-align:center}
.pb-canvas{border:2px dashed var(--border);border-radius:14px;padding:12px;min-height:120px;
  background:var(--bg-soft);transition:border-color .12s,background .12s}
.pb-canvas.drop-hot{border-color:var(--primary);background:var(--primary-soft)}
.pb-block{display:flex;align-items:center;gap:9px;border:1px solid var(--border);
  border-radius:12px;padding:9px 11px;background:var(--bg);box-shadow:var(--shadow);position:relative}
.pb-block.dragging{opacity:.4}
.pb-block .pb-handle{cursor:grab;color:var(--text-3);font-size:15px;flex-shrink:0;padding:2px}
.pb-block .pb-handle:active{cursor:grabbing}
.pb-block .pb-num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pb-block .pb-ico{font-size:17px;flex-shrink:0}
.pb-block .pb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pb-block .pb-toprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pb-block .pb-label{font-weight:700;font-size:13px}
.pb-block select,.pb-block input{min-width:0;max-width:100%;border:1px solid var(--border);border-radius:8px;
  padding:5px 8px;background:var(--bg-soft);font-size:12.5px}
.pb-block .pb-instr{width:100%}
.pb-block .pb-del{color:var(--text-3);padding:3px 7px;border-radius:6px;flex-shrink:0}
.pb-block .pb-del:hover{color:var(--red);background:var(--red-soft)}
.pb-conn{display:flex;justify-content:center;align-items:center;color:var(--text-3);
  font-size:15px;height:20px;line-height:1}
.pb-drop-line{height:3px;background:var(--primary);border-radius:2px;margin:2px 0}
.pb-empty{text-align:center;color:var(--text-3);font-size:13px;padding:22px 10px}
.pb-flow{margin-top:12px;padding:10px 12px;background:var(--bg-soft);border-radius:10px;
  font-size:12.5px;color:var(--text-2);line-height:1.6}

/* ---------- Dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--bg)}
.stat .s-num{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .s-lbl{color:var(--text-3);font-size:12.5px;margin-top:2px}
.stat.clickable{cursor:pointer;transition:all .15s}
.stat.clickable:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.cap{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.cap:last-child{border-bottom:none}
.cap .c-state{margin-left:auto;font-weight:600;font-size:12.5px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px;
  background:var(--bg-soft);border-radius:12px;font-size:12.5px;color:var(--text-2);margin-bottom:18px}
.flow b{color:var(--text)}
.flow .arrow{color:var(--text-3)}

/* ---------- Code-Sandbox ---------- */
.sb-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sb-bar select,.sb-bar input{border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--bg)}
.sb-split{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
.sb-files{border:1px solid var(--border);border-radius:12px;padding:8px;max-height:520px;overflow-y:auto}
.sb-files button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;
  font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-files button:hover{background:var(--bg-hover);color:var(--text)}
.sb-files button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
#sb-editor{width:100%;min-height:300px;border:1px solid var(--border);border-radius:12px;
  padding:14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;
  line-height:1.55;resize:vertical;outline:none;background:var(--bg)}
#sb-editor:focus{border-color:var(--primary)}
.sb-console{background:var(--code-bg);color:var(--code-text);border-radius:12px;padding:14px;margin-top:12px;
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;
  max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.sb-console .ok{color:var(--console-ok)}
.sb-console .bad{color:var(--console-bad)}
.warn-box{border:1px solid var(--amber);background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;
  padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.5}
.ok-box{border:1px solid var(--green);background:var(--green-soft);color:var(--green-ink);border-radius:12px;
  padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border-soft);padding-bottom:0}
.tab{padding:8px 14px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;
  margin-bottom:-1px}
.tab.active{color:var(--text);border-color:var(--primary)}

/* ═══ Handy und Tablet ══════════════════════════════════════════════════
   Bis hierher war die Oberflaeche reines Desktop — keine einzige
   @media-Regel. Auf einem Handy heisst das: 250 px Seitenleiste fressen
   zwei Drittel des Schirms, Tabellen laufen aus dem Bild.

   Der Weg aufs Handy fuehrt ueber genau diese Datei. Ein Browser braucht
   keinen App-Store und keine Freigabe, und Dive on Wide liefert die Oberflaeche
   ohnehin schon aus. Was fehlte, war nur, dass sie dort auch bedienbar ist. */
@media (max-width: 860px) {
  /* Die Seitenleiste wird zur Schublade, die von links hereinfaehrt. */
  #app { position: relative; }
  #sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 60;
    width: min(84vw, 300px); min-width: 0;
    transform: translateX(-102%); transition: transform .22s ease;
    box-shadow: var(--shadow-lg); overflow-y: auto;
  }
  #app.offen #sidebar { transform: none; }
  #schublade-schatten {
    display: none; position: fixed; inset: 0; z-index: 55;
    background: rgba(16,27,38,.45);
  }
  #app.offen #schublade-schatten { display: block; }
  #menue-knopf { display: flex !important; }
  #main { padding-top: 52px; }

  /* Inhalte duerfen nie waagerecht aus dem Bild laufen. */
  .view-pad { padding: 16px 14px 90px !important; }
  .view-head { flex-wrap: wrap; gap: 10px; }

<script>
"use strict";
/* =====================================================================
   Dive on Wide Frontend — Vanilla JS SPA
   ===================================================================== */
const API = "";                    // gleiche Origin wie server.py

/* ── Sprache ──────────────────────────────────────────────────────────
   Englisch zur Laufzeit: Textknoten, Platzhalter und Tooltips werden anhand
   von /lang/en.json ersetzt (Schlüssel: deutsches Stück, Zahlen als „§“).
   Chat-Inhalte, Code und Eingaben bleiben unangetastet. Was in Englisch noch
   deutsch auftaucht, meldet die Seite als Lücke — die nächste Übersetzung
   (werkzeuge/sprache.py) schließt sie. */
const SPRACHE = {code: "de", w: null, fehlend: new Set()};
function spracheWahl() {
  try { const s = localStorage.getItem("dowos-sprache"); if (s) return s; } catch(_) {}
  return (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";
}
function _uebersetze(roh) {
  const kern = roh.trim();
  if (!kern || !SPRACHE.w) return null;
  const zahlen = [];
  const k = kern.replace(/\s+/g, " ").replace(/\d+(?:[.,]\d+)?/g, m => { zahlen.push(m); return "§"; });
  let en = SPRACHE.w[k];
  if (en === undefined) {
    // Vorlagen mit eingesetzten Werten („Das Planner-Modell „{}“ kann keine Bilder …“)
    const v = _vorlage(kern.replace(/\s+/g, " "));
    if (v !== null) return roh.match(/^\s*/)[0] + v + roh.match(/\s*$/)[0];
  }
  if (en === undefined) {
    // Zweite Stufe: bekannte Wendungen IN der Zeile ersetzen (Modellname, Zahl oder zwei
    // Sätze im selben Textknoten). Nur wenn ≥ 60 % der Wörter so abgedeckt sind — eigene
    // Texte des Nutzers werden nicht halb übersetzt.
    const t = _ersetzeTeile(kern);
    if (t !== null) return roh.match(/^\s*/)[0] + t + roh.match(/\s*$/)[0];
  }
  if (en === undefined) {
    // Symbol davor („＋ Neuer Chat“, „○ nicht gestartet“): den Text dahinter übersetzen.
    const v = k.match(/^([^\p{L}\p{N}§]+)(.+)$/u);
    if (v && SPRACHE.w[v[2]] !== undefined) en = v[1] + SPRACHE.w[v[2]];
  }
  if (en === undefined) {
    if (/[äöüÄÖÜß]|\b(der|die|das|und|nicht|ist|mit|für|von|noch|keine?|oder|wenn|über|nächste|täglich|läuft|zuletzt)\b/.test(kern)
        && SPRACHE.fehlend.size < 500) SPRACHE.fehlend.add(k);
    return null;
  }
  let i = 0;
  return roh.match(/^\s*/)[0] + en.replace(/§/g, () => zahlen[i++] ?? "") + roh.match(/\s*$/)[0];
}
let _teile = null;
let _vorlagen = null;
// Meldungen des Servers mit eingesetzten Werten (Modellname, Adresse, Fehlertext): Schlüssel mit „{}“
// je Wert und „§“ je Zahl. Die Werte werden unverändert in die englische Fassung übernommen.
function _vorlage(text) {
  if (!_vorlagen) {
    _vorlagen = Object.keys(SPRACHE.w).filter(k => k.includes("{}")).sort((a, b) => b.length - a.length).map(k => {
      const arten = [];
      const muster = k.split(/(\{\}|§)/).map(t => {
        if (t === "{}") { arten.push("v"); return "(.+?)"; }
        if (t === "§") { arten.push("z"); return "(\\d+(?:[.,]\\d+)?)"; }
        return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }).join("");
      return {re: new RegExp("^([^\\p{L}\\p{N}]*?)" + muster + "$", "u"), arten, en: SPRACHE.w[k]};
    });
  }
  for (const v of _vorlagen) {
    const m = text.match(v.re);
    if (!m) continue;
    const werte = m.slice(2).map((x, i) => ({art: v.arten[i], x}));
    const w = werte.filter(a => a.art === "v").map(a => a.x), z = werte.filter(a => a.art === "z").map(a => a.x);
    let iw = 0, iz = 0;
    return m[1] + v.en.replace(/\{\}|§/g, t => t === "{}" ? (w[iw++] ?? "") : (z[iz++] ?? ""));
  }
  return null;
}
function _ersetzeTeile(kern) {
  // Nur Wendungen aus mindestens zwei Wörtern: einzelne Wörter („keine“, „nicht“) mitten im Satz
  // ergaben Wortsalat („kann no Bilder verarbeiten — es sieht not the screen“, Windows-VM 02.10.2026).
  if (!_teile) _teile = Object.keys(SPRACHE.w).filter(k => k.length >= 4 && !k.includes("§")
                                && (/\S\s+\S/.test(k.trim()) || /^[A-ZÄÖÜ][\wäöüß-]{5,}$/.test(k)))  // oder ein Name: „Sicherheits-Prüfer“
                              .sort((a, b) => b.length - a.length);
  const woerter = (kern.match(/[\p{L}-]+/gu) || []).filter(w => /\p{Ll}/u.test(w)).length;
  if (!woerter) return null;
  let text = kern, getroffen = 0;
  for (const k of _teile) {
    if (k.length > text.length) continue;
    const i = text.indexOf(k);
    if (i < 0) continue;
    const vor = text[i - 1], nach = text[i + k.length];
    if ((vor && /[\p{L}\p{N}]/u.test(vor)) || (nach && /\p{L}/u.test(nach))) continue;
    text = text.slice(0, i) + SPRACHE.w[k] + text.slice(i + k.length);
    getroffen += (k.match(/[\p{L}-]+/gu) || []).filter(w => /\p{Ll}/u.test(w)).length;
  }
  if (!getroffen || getroffen / woerter < 0.6) return null;
  // Bleibt Deutsch übrig, lieber der ganze Satz auf Deutsch als ein halb übersetzter
  return /\b(der|die|das|und|nicht|ist|mit|für|auf|kein|keine|du|dein|oder|wird|kann|sich|ein|eine|einen|den|dem|zu)\b/i.test(text) ? null : text;
}
function _roh(el) { return el.closest && el.closest(".m-content, .chat-item, pre, code, textarea, [contenteditable], [data-roh]"); }
function spracheAnwenden(wurzel) {
  if (SPRACHE.code !== "en" || !SPRACHE.w || !wurzel) return;
  const gehe = n => {
    if (n.nodeType === 3) {
      const p = n.parentElement;
      if (!p || _roh(p) || p.tagName === "SCRIPT" || p.tagName === "STYLE") return;
      const t = _uebersetze(n.nodeValue);
      if (t !== null && t !== n.nodeValue) n.nodeValue = t;
      return;
    }
    if (n.nodeType !== 1 || _roh(n) || n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
    for (const a of ["placeholder", "title", "aria-label"]) {
      const v = n.getAttribute(a);
      if (v) { const t = _uebersetze(v); if (t !== null && t !== v) n.setAttribute(a, t); }
    }
    for (const c of n.childNodes) gehe(c);
  };
  gehe(wurzel);
}
async function spracheStarten() {
  SPRACHE.code = spracheWahl();
  document.documentElement.lang = SPRACHE.code;
  if (SPRACHE.code !== "en") return;
  try { SPRACHE.w = await (await fetch(API + "/lang/en.json")).json(); } catch(_) { return; }
  spracheAnwenden(document.body);
  new MutationObserver(ms => { for (const m of ms) {
      if (m.type === "childList") m.addedNodes.forEach(spracheAnwenden); else spracheAnwenden(m.target); } })
    .observe(document.body, {childList: true, subtree: true, characterData: true, attributes: true,
                             attributeFilter: ["placeholder", "title", "aria-label"]});
  setInterval(() => {
    if (!SPRACHE.fehlend.size) return;
    const texte = [...SPRACHE.fehlend]; SPRACHE.fehlend.clear();
    fetch(API + "/api/sprache/fehlend", {method: "POST", headers: authHeaders(),
      body: JSON.stringify({texte})}).catch(() => {});
  }, 60000);
}
/* Für die wichtigsten Bildschirme (Einrichtung): Englisch von Hand, nicht aus dem Wörterbuch. */
function L(de, en) { return SPRACHE.code === "en" ? en : de; }
function spracheSetzen(code) {

  location.reload();

// Ohne diesen Satz stellte sich Dive on Wide dem ersten Nutzer als "entwickelt
// von OpenAI" vor: Das Basismodell füllt eine Leerstelle lieber, als sie

let state = {

  sessionId: null,
  messages: [],                    // {role, content}
  sessions: [],
  agents: [], prompts: [], skills: [], templates: [], knowledge: [],
  models: [], defaultModel: "",

  streaming: false,

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);
// esc() deckt HTML ab: Text UND Attributwerte, egal ob mit " oder ' begrenzt.
// Das einfache Anfuehrungszeichen fehlte, und ein placeholder='...' liess sich
// damit verlassen.
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
// jsarg() deckt den DOPPELTEN Kontext ab: ein Wert, der in einem on*-Attribut
// innerhalb eines JavaScript-Strings landet, also in einem on-Klick-Aufruf
// der Form  fn('WERT')  im Attribut.
//
// esc() allein reicht dort NICHT, und zwar aus einem Grund, der leicht zu
// uebersehen ist: Der Browser dekodiert die HTML-Entitaeten im Attributwert,
// BEVOR er den Rest als JavaScript liest. Aus &#39; wird also wieder ein
// Anfuehrungszeichen, und der String ist verlassen. Deshalb wird hier zuerst
// fuer JavaScript maskiert und erst danach fuer HTML.
//
// Gefunden am 23.09.2026: Ein Dateiname im Arbeitsordner der Sandbox erzeugte
// onclick="sbOpen('a'),window.__EINGEDRUNGEN=1,sbOpen('b.py')". Dateinamen legt
// der Coding-Diver an, und dessen Eingabe kann aus dem Netz stammen. Der
// eingespeiste Code laeuft mit der Sitzung des Nutzers - und ueber diese
// Sitzung fuehrt Dive on Wide Code aus.
const jsarg = s => esc(String(s ?? "")
  .replace(/\\/g, "\\\\").replace(/'/g, "\\'")
  .replace(/\n/g, "\\n").replace(/\r/g, "\\r"));
function authHeaders() {
  const h = {"Content-Type":"application/json"};
  if (state.token) h["X-Auth-Token"] = state.token;
  return h;
}
/* Hängt den Zugangsschlüssel an Direkt-Links (Downloads, Bilder) — Browser
   senden bei <a href>/<img src> keine eigenen Header mit. */
function dl(p) {
  return state.token
    ? p + (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(state.token)
    : p;
}
/* Ist der Server weg, wirft fetch einen TypeError ("Failed to fetch") — ohne
   Status, ohne Meldung. Ungefangen bleibt der Klick dann einfach wirkungslos:
   Die Ansicht wechselt nicht, nichts erscheint, nichts erklärt sich. Genau so
   sah es aus, als der Server während einer offenen Seite beendet wurde. Deshalb
   wird dieser eine Fall überall gleich behandelt und sichtbar gemacht. */
function istVerbindungsfehler(e) {
  return e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(e && e.message || "");
}
function verbindungBanner(anzeigen) {
  let el = document.getElementById("verbindung-weg");
  if (!anzeigen) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement("div");
  el.id = "verbindung-weg";
  el.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;padding:10px 16px;" +
    "background:#e5484d;color:#fff;font-size:14px;text-align:center";
  el.innerHTML = "⚠️ <b>Dive on Wide ist nicht erreichbar.</b> Läuft der Server noch? " +
    "Im Terminal <code style=\"background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px\">./start.sh</code> " +
    "starten — danach <a href=\"#\" onclick=\"location.reload();return false\" " +
    "style=\"color:#fff;text-decoration:underline\">neu laden</a>.";
  document.body.appendChild(el);
}

async function api(path, opts={}) {
  let r;
  try {
    r = await fetch(API + path, Object.assign({headers: authHeaders()}, opts));
  } catch (e) {
    if (istVerbindungsfehler(e)) { verbindungBanner(true); throw new Error("Dive on Wide ist nicht erreichbar (Server beendet?)"); }
    throw e;
  }
  verbindungBanner(false);
  if (r.status === 401) { showLogin(); throw new Error("Zugangsschlüssel nötig"); }
  if (!r.ok) { let e = {}; try{e = await r.json();}catch(_){}
    throw new Error(e.error || ("HTTP " + r.status)); }
  return r.json();
}
/* Kurzform für POST-Aufrufe.

   api() erwartet als zweites Argument fetch-Optionen. Gibt man dort ein
   Objekt mit Nutzdaten hinein, macht fetch stillschweigend ein GET und die
   Daten verschwinden — kein Fehler, keine Meldung, nur ein 404 oder gar
   nichts. Genau das ist beim Mesh passiert. Dieser Helfer macht den Fehler
   unmöglich. */
function apiPost(pfad, daten) {
  return api(pfad, {method: "POST", body: JSON.stringify(daten || {})});
}

/* Eine Zeile der Computer-Use-Prüfliste. Jeder Punkt sagt einzeln, ob er
   erfüllt ist — vorher stand nur ein pauschales „bereit“ da, das auch dann

function cuRow(name, on, hint) {

}

function timeAgo(ts) {
  const d = (Date.now()/1000 - ts);
  if (d < 60) return "gerade eben";
  if (d < 3600) return Math.floor(d/60) + " Min.";
  if (d < 86400) return Math.floor(d/3600) + " Std.";
  return new Date(ts*1000).toLocaleDateString("de-DE");
}

/* ---------------- Mini-Markdown-Renderer ---------------- */
function renderMarkdown(src) {
  const blocks = [];
  // Codeblöcke herausziehen
  src = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, lang, code) => {
    blocks.push({lang: lang || "text", code});
    return "\u0001CB" + (blocks.length-1) + "\u0001";
  });
  let html = esc(src);
  // Tabellen
  html = html.replace(/((?:^\|.*\|\s*$\n?)+)/gm, tbl => {
    const lines = tbl.trim().split("\n").filter(l=>l.trim());
    if (lines.length < 2 || !/^\|[\s:-]+\|/.test(lines[1])) return tbl;
    const cells = l => l.split("|").slice(1,-1).map(c=>c.trim());
    let out = "<table><tr>" + cells(lines[0]).map(c=>"<th>"+c+"</th>").join("") + "</tr>";
    for (let i=2;i<lines.length;i++)
      out += "<tr>" + cells(lines[i]).map(c=>"<td>"+c+"</td>").join("") + "</tr>";
    return out + "</table>";
  });
  html = html
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>")
    .replace(/^\s*\d+\. (.*)$/gm, "<li data-ol>$1</li>")
    // Eine Liste ist ein eigener Block: ohne Zeilenumbrüche darin, sonst wurde aus jedem \n ein <br> zwischen den
    // Punkten — und eine Liste direkt unter einem Satz hatte riesige Abstände (07.10.2026).
    .replace(/(<li>.*<\/li>\n?)+/g, m => "\n\n<ul>" + m.replace(/\n/g, "") + "</ul>\n\n")
    .replace(/(<li data-ol>.*<\/li>\n?)+/g, m => "\n\n<ol>" + m.replace(/ data-ol/g, "").replace(/\n/g, "") + "</ol>\n\n")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // Absätze
  html = html.split(/\n{2,}/).map(p => {
    if (!p.trim()) return "";
    if (/^\s*(<(h\d|ul|ol|table|blockquote)|\u0001CB)/.test(p)) return p;
    return "<p>" + p.replace(/\n/g,"<br>") + "</p>";
  }).join("\n");
  // Codeblöcke wieder einsetzen
  html = html.replace(/(<p>)?\u0001CB(\d+)\u0001(<\/p>)?/g, (m, _a, i) => {
    const b = blocks[+i];
    const id = "cb" + Math.random().toString(36).slice(2,8);
    window._codeblocks = window._codeblocks || {};
    window._codeblocks[id] = b;
    return `<div class="codeblock"><div class="cb-head"><span>${esc(b.lang)}</span>
      <span><button onclick="copyCode('${jsarg(id)}')">Kopieren</button>
      <button onclick="saveCodeArtifact('${jsarg(id)}')">Als Artefakt speichern</button></span></div>
      <pre>${esc(b.code)}</pre></div>`;
  });
  // Artefakt-Bilder brauchen den Zugangsschlüssel als URL-Parameter
  if (state.token)
    html = html.replace(/src="(\/api\/artifacts\/[^"]+)"/g, (m,u)=>`src="${dl(u)}"`);
  return html;
}
function copyCode(id){ navigator.clipboard.writeText(window._codeblocks[id].code)
  .then(()=>toast("Code kopiert ✅")); }
async function saveCodeArtifact(id){

function schubladeUm() { document.getElementById("app").classList.toggle("offen"); }

/* Die Ansichten stehen in der Adresse. Damit lassen sich Lesezeichen setzen,
   Links verschicken („schau mal ins Netzwerk") und der Zurück-Knopf tut, was
   man erwartet. Vorher war jede Ansicht dieselbe Adresse — ein neu geladenes
   Fenster landete immer wieder im Chat. */
const ANSICHTEN = ["chat","inbox","templates","agents","artifacts","prompts",
  "skills","knowledge","settings","pipelines","research","dashboard","sandbox",
  "mesh","bote","forum","modelle","rhythmus","training","werkbank"];

function ansichtAusAdresse() {
  const h = (location.hash || "").replace(/^#\/?/, "").split("?")[0].trim();
  const teil = h.split("/")[0];
  return ANSICHTEN.includes(teil) ? teil : "";
}

/* „#chat/<id>" — welche Unterhaltung ist gemeint? */
function sitzungAusAdresse() {
  const h = (location.hash || "").replace(/^#\/?/, "").split("?")[0].trim();
  const teile = h.split("/");
  return (teile[0] === "chat" && teile[1]) ? teile[1] : "";
}

function show(view, ausAdresse) {
  schubladeZu();          /* nach der Auswahl gibt die Schublade den Blick frei */
  state.view = view;
  document.body.dataset.ansicht = view;   /* z. B. rückt der Lotsen-Knopf im Chat über die Eingabe */
  /* Beim Folgen der Adresse NICHT zurückschreiben — das legte sonst bei jedem
     Zurück-Klick einen neuen Eintrag an, und der Knopf käme nie ans Ziel. */
  if (!ausAdresse && ANSICHTEN.includes(view) && ansichtAusAdresse() !== view
      && !(view === "chat" && sitzungAusAdresse())) {
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
  }
  setActiveNav();
  const renderers = {chat: renderChat, inbox: renderInbox, templates: renderTemplates,
    agents: renderAgents, artifacts: renderArtifacts, prompts: renderPrompts,
    skills: renderSkills, knowledge: renderKnowledge, settings: renderSettings,
    pipelines: renderPipelines, research: renderResearch,
    dashboard: renderDashboard, sandbox: renderSandbox, mesh: renderMesh,
    bote: renderBote, forum: renderForum, modelle: renderModelle,
    rhythmus: renderRhythmus, training: renderTraining, werkbank: renderWerkbank};
  /* Wirft eine Ansicht beim Laden, darf der Klick nicht wirkungslos verpuffen:
     Dann steht wenigstens da, was los ist. */
  try {
    const ergebnis = (renderers[view] || renderChat)();
    if (ergebnis && typeof ergebnis.catch === "function") {
      ergebnis.catch(e => ansichtFehler(view, e));
    }
  } catch (e) { ansichtFehler(view, e); }
}

function ansichtFehler(view, e) {
  const nachricht = (e && e.message) || String(e);
  const weg = /nicht erreichbar|Failed to fetch/i.test(nachricht);
  const ziel = document.getElementById("view");
  if (ziel) {
    ziel.innerHTML = '<div class="view-pad"><div class="warn-box">⚠️ Die Ansicht <b>' +
      esc(view) + '</b> konnte nicht geladen werden: ' + esc(nachricht) +
      (weg ? '<br><br>Der Server antwortet nicht. Im Terminal <code>./start.sh</code> starten, dann neu laden.'
           : '') + '</div></div>';
  }
  console.error("Ansicht " + view + ":", e);
}

window.addEventListener("hashchange", () => {
  const v = ansichtAusAdresse();
  if (v && v !== state.view) show(v, true);
});

/* Hardware-Scan und passende Modelle — auch solche, die noch nicht geladen sind. */
function hardwareKarte(l) {
  const h = l.hardware;
  if (!h) return "";
  const gpu = (h.gpus || []).map(g => esc(g.name) + (g.vram_gib ? ` (${g.vram_gib} GB VRAM)` : g.kerne ? ` (${g.kerne} ${L("Kerne", "cores")})` : "")).join(", ") || L("keine erkannt", "none detected");
  const zeile = (e, wie) => {
    if (!e) return "";
    const stufe = e.stufe === "knapp" ? `<span class="warn">${L("knapp — lädt langsamer, große Programme daneben schließen", "tight — loads slower, close large programs alongside")}</span>` : L("passt bequem", "fits comfortably");
    const knopf = e.installiert ? `<span class="health-ok">${L("✓ schon da", "✓ already there")}</span>`
      : `<button class="btn btn-ghost btn-sm" onclick="modellLaden(this, '${jsarg(e.tag)}')">${L("Laden", "Download")} (${e.groesse_gb} GB)</button>`;
    return `<div style="padding:6px 0;border-top:1px solid var(--border-soft)">
      <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <span><b>${esc(e.name)}</b>${wie ? ` <span style="color:var(--accent);font-size:12px">· ${esc(wie)}</span>` : ""}</span>${knopf}</div>
      <div style="color:var(--text-2);font-size:12.5px;margin-top:2px">${stufe}${e.gemessen ? " · <i>" + esc(e.gemessen) + "</i>" : ""}</div>
      <code style="font-size:11px;color:var(--text-3);word-break:break-all">${esc(e.tag)}</code></div>`;
  };
  const vor = l.vorschlaege || {};
  const rollen = Object.keys(vor).map(r => {
    const v = vor[r];
    if (!v.beste) return `<p class="h" style="margin:8px 0 2px"><b>${esc(v.text)}</b>: ${L("nichts Passendes für diesen Rechner.", "nothing suitable for this machine.")}</p>`;
    return `<p class="h" style="margin:10px 0 2px"><b>${esc(v.text)}</b></p>` + zeile(v.beste, "Empfehlung")
      + (v.weitere || []).map(w => zeile(w, "")).join("")
      + ((v.vergleich || []).length ? `<details style="margin:4px 0 0"><summary class="h" data-roh>📏 ${L("Zum Vergleich gemessen", "Measured for comparison")}</summary>
          ${v.vergleich.map(x => `<div class="h" style="font-size:12.5px;padding:2px 0"><b>${esc(x.name)}</b>: <i>${esc(x.gemessen)}</i></div>`).join("")}</details>` : "");
  }).join("");
  return `<div class="karte"><h3>Dein Rechner</h3>
    <p class="h" data-roh>${esc(h.cpu && h.cpu.name || h.arch)} · ${h.cpu && h.cpu.kerne || "?"} ${L("Kerne", "cores")} · ${h.ram_gib || "?"} GB ${L("Arbeitsspeicher", "RAM")} · ${L("Grafik", "Graphics")}: ${gpu}
      · ${h.platte_frei_gib != null ? h.platte_frei_gib + L(" GB frei", " GB free") : ""}<br>
      ${L("Modelle rechnen hier auf", "Models run here on")}: <b>${esc(L(h.rechnet_auf || "?", (h.rechnet_auf || "?").replace("gemeinsamer Speicher", "shared memory").replace("-Grafikkarte", " graphics card")))}</b>, ${L("realistisch bis etwa", "realistically up to about")} <b>${h.modell_speicher_gib || "?"} GB</b> ${L("Modellgröße", "model size")}.</p>
    ${(h.hinweise || []).map(t => `<p class="h warn">${esc(t)}</p>`).join("")}
    ${l.ollama_entfernt ? `<p class="h">${L("Ollama läuft auf einem anderen Rechner — was dort passt, entscheidet dessen Speicher.", "Ollama runs on another machine — its memory decides what fits there.")}</p>` : rollen}
  </div>`;
}

async function modellLaden(knopf, tag) {
  if (!confirm("„" + tag + "“ jetzt über Ollama herunterladen? Das sind mehrere Gigabyte und kann je nach Leitung einige Minuten dauern.")) return;
  knopf.disabled = true;
  try {
    const r = await apiPost("/api/modelle/laden", {tag});
    const takt = setInterval(async () => {
      try {
        const l = await api("/api/runs/" + r.run_id);
        const letzte = (l.progress || []).slice(-1)[0];
        knopf.textContent = letzte ? letzte.text.replace(tag + ": ", "") : "lädt …";
        if (l.status !== "running") {
          clearInterval(takt);
          if (l.status === "done") { toast(tag + " ist geladen 📦"); const neu = await api("/api/einrichtung"); const d = document.getElementById("einr"); if (d) { d.remove(); einrichtungZeigen(neu); } }
          else { knopf.textContent = "Fehler"; toast(l.result || "Laden fehlgeschlagen"); knopf.disabled = false; }
        }
      } catch(_) {}
    }, 1500);
  } catch(e) { toast(e.message); knopf.disabled = false; }
}

async function einrichtungSpeichern(allesAus) {
  const wert = id => { const e = $(id); return e ? e.value : ""; };
  const an = id => { const e = $(id); return !!(e && e.checked); };
  const netzEl = document.querySelector('input[name="ei-netz"]:checked');
  const wahl = allesAus
    ? {ollama_url: wert("#ei-url"), modell: wert("#ei-modell"), schalter: {}}
    : {
        ollama_url: wert("#ei-url"),
        modell: wert("#ei-modell"),
        schalter: {
          SANDBOX_ENABLED: an("#ei-sandbox"),
          BRAIN_AUTOSYNC: an("#ei-brain"),
          COMPUTER_USE_ENABLED: an("#ei-computer"),
        },
        netz: netzEl ? netzEl.value : "",
        netz_dauerhaft: an("#ei-netz-dauer"),
        briefing: an("#ei-briefing"),
        lernen: an("#ei-lernen"),
        briefing_zeit: wert("#ei-briefing-zeit"),
      };
  const lokalSuchen = an("#ei-lokal-suchen");
  try { await apiPost("/api/einrichtung", wahl); } catch(e) { toast(e.message); }
  if (lokalSuchen) {
    try {
      const funde = await lokaleServerSuchen();
      const neu = (funde || []).map((f, i) => [f, i]).filter(([f]) => !f.eingetragen && f.modelle.length);
      for (const [, i] of neu) await lokalEintragen(i, true);
      if (neu.length) toast("🔒 " + neu.map(([f]) => f.name).join(", ") + L(" eingetragen", " added"));
    } catch(e) {}
  }
  const d = document.getElementById("einr");
  if (d) d.remove();
  toast(allesAus ? "Alles bleibt aus — jederzeit änderbar" : "Eingerichtet ✓");
  try { await bootData(); } catch(e) {}
  if (!(await erstStart())) show("dashboard");
}

/* Der allererste Chat: Starter-Assistent gewählt, „Erkläre mir Dive on Wide“ steht schon da.
   Abgeschickt wird nichts — der Mensch drückt selbst Enter. Nur einmal, und nie, wenn es schon Chats gibt. */
async function erstStart() {
  try { if (localStorage.getItem("dow-erststart")) return false; } catch(e) {}
  if (document.getElementById("einr")) return false;
  let chats = [];
  try { chats = await api("/api/sessions"); } catch(e) { return false; }
  try { localStorage.setItem("dow-erststart", "1"); } catch(e) {}
  if (chats.length) return false;
  await erklaerStart();
  return true;
}
async function erklaerStart() {
  const starter = (state.agents || []).find(a => a.name === "Starter-Assistent") || null;
  await newChat(starter);
  fillInput(L("Erkläre mir Dive on Wide", "Explain Dive on Wide to me"));
}

function taktWann(x) {
  const tage = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  if (x.art === "intervall") return "alle " + x.intervall_min + " Minuten";
  // Der gespeicherte Wert ist der Wochentag, wie Python ihn zaehlt: Mo=0.
  const wt = (x.wochentage||"").split(",").filter(z=>z!=="").map(z=>tage[+z]);
  return (x.art === "einmal" ? "einmalig um " : "täglich um ") + x.uhrzeit
       + (wt.length ? " (" + wt.join(", ") + ")" : "");
}

function taktFelder() {
  const was = $("#tk-was") ? $("#tk-was").value : "briefing";
  const art = $("#tk-art") ? $("#tk-art").value : "taeglich";
  const zeig = (id, an) => { const e = $(id); if (e) e.style.display = an ? "" : "none"; };
  zeig("#tk-ziel-feld", was === "agent" || was === "skill");
  zeig("#tk-eingabe-feld", was !== "briefing" && was !== "konsolidieren");
  zeig("#tk-projekt-feld", was === "werkbank");
  zeig("#tk-uhr-feld", art !== "intervall");
  zeig("#tk-int-feld", art === "intervall");
  zeig("#tk-tage-feld", art === "taeglich");
  const og = {agent: "#tk-og-a", skill: "#tk-og-s"};
  ["#tk-og-a", "#tk-og-s"].forEach(id => { const e = $(id); if (e) e.disabled = (og[was] !== id); });
}

async function taktAnlegen() {
  const tage = Array.from(document.querySelectorAll("#tk-tage input:checked"))
                    .map(e => e.value).join(",");
  const daten = {
    name: $("#tk-name").value, was: $("#tk-was").value, art: $("#tk-art").value,
    ziel: $("#tk-was").value === "werkbank" ? ($("#tk-projekt").value.trim() || "rhythmus") : ($("#tk-ziel") ? $("#tk-ziel").value : ""),
    eingabe: $("#tk-eingabe") ? $("#tk-eingabe").value : "",
    uhrzeit: $("#tk-uhr") ? $("#tk-uhr").value : "08:00",
    intervall_min: $("#tk-int") ? Number($("#tk-int").value) : 60,
    wochentage: tage,
    zustellen: $("#tk-zustellen") ? $("#tk-zustellen").value : "",
    modell: $("#tk-modell") ? $("#tk-modell").value : "",
    aufbauen_auf: $("#tk-auf") ? [...$("#tk-auf").selectedOptions].map(o => o.value).join(",") : "",
  };
  try {
    const r = await apiPost("/api/zeitplan/neu", daten);
    if (r.fehler) return toast(r.fehler);
    closeModal(); toast("Eintrag angelegt 🕰"); renderRhythmus();
  } catch(e) { toast(e.message); }
}

async function taktUm(id) {
  try { await apiPost("/api/zeitplan/um", {id: id}); } catch(e) { toast(e.message); }
  renderRhythmus();
}

async function taktWeg(id) {
  try { await apiPost("/api/zeitplan/weg", {id: id}); toast("Eintrag entfernt"); }
  catch(e) { toast(e.message); }
  renderRhythmus();
}

async function taktJetzt(id) {
  try {
    const r = await apiPost("/api/zeitplan/jetzt", {id: id});
    toast(r.fehler ? r.fehler : "Läuft — Ergebnis kommt in die Inbox ▶");
  } catch(e) { toast(e.message); }
  setTimeout(renderRhythmus, 800);
}

/* =====================================================================
   NETZWERK (Mesh)
   ===================================================================== */
let meshTakt = null;

function meshPlanHtml(a) {
  if (!a) return `<p style="color:var(--text-3);font-size:13px">Noch kein Plan gerechnet.</p>`;
  const L = a.laufzeit || {};
  /* Die Laufzeitlage steht OBEN und nicht unten. Ein schöner Plan, dem die
     Rückseite fehlt, sähe sonst aus wie etwas, das gleich losläuft. */
  const lauf = L.bereit
    ? `<div class="ok-box" style="margin-bottom:10px">✅ llama.cpp mit RPC ist bereit — der Plan lässt sich ausführen.</div>`
    : `<div class="warn-box" style="margin-bottom:10px">
         ⚠️ <b>Verteiltes Rechnen ist auf diesem Gerät noch nicht möglich.</b>
         ${(L.hinweise||[]).map(h=>`<div style="margin-top:6px">${esc(h)}</div>`).join("")}
       </div>`;
  if (!a.plan) return lauf + `<p style="color:var(--text-2);font-size:13.5px">${esc(a.grund||"Kein Plan möglich.")}</p>`;
  const g = a.geschwindigkeit || {};
  const je = a.plan.modell_gb / a.plan.schichten;
  return lauf + `
    <p style="color:var(--text-2);font-size:13px;margin-bottom:8px">
      ${esc(a.modell||"Modell")} · ${a.plan.modell_gb} GB über ${a.plan.schichten} Schichten
      ${a.masse && a.masse.geschaetzt ? " <i>(Größe geschätzt aus dem Namen)</i>" : ""}</p>
    ${a.plan.knoten.map(k=>`
      <div class="mesh-geraet"><span>${k.fuehrt?"🎬":"🧩"}</span>
        <span class="g-id">${esc(k.id)}${k.fuehrt?" (führt an)":" · "+esc(k.adresse)}</span>
        <span class="g-gb">${k.schichten} Schichten · ${(k.schichten*je).toFixed(1)} GB</span></div>`).join("")}
    ${a.ausfuehrbar ? `<button class="btn" style="margin-top:10px"
        onclick="meshVerteiltStart()">▶ Dieses Modell jetzt verteilt starten</button>`
      : `<p style="color:var(--text-3);font-size:12.5px;margin-top:10px">
           ${a.modell_pfad ? "" : "Zu diesem Namen ließ sich keine Modelldatei finden — "}
           ${L.kann_fuehren ? "" : "llama-server kann kein --rpc — "}
           deshalb lässt sich der Plan noch nicht ausführen.
         </p>`}
    <p style="color:var(--text-3);font-size:12.5px;margin-top:10px">
      Grobe Schätzung: <b>${g.token_pro_sekunde||0} Token/s</b> über ${g.stufen||0} Stufen.
      Der Engpass ist die Speicherbandbreite, nicht die Rechenleistung — jedes
      Gewicht muss je Token einmal gelesen werden.</p>`;
}

function meshVerteiltLaufHtml(v) {
  if (!v || !v.laeuft) return "";
  const stufen = (v.plan && v.plan.knoten) ? v.plan.knoten.length : 0;
  return `<div class="ok-box">
    🧩 <b>${esc((v.modell||"").split("/").pop())}</b> läuft verteilt über
    ${stufen} Gerät(e). Es steht jetzt überall zur Wahl, wo Dive on Wide Modelle
    anbietet — Chat, Diver, Skills, Pipelines.
    <div style="margin-top:6px;opacity:.85">Die Zwischenergebnisse kommen von
    den anderen Geräten; <b>zusammengesetzt wird die Antwort nur hier.</b>
    Kein anderes Gerät sieht je den fertigen Text.</div>
    <button class="btn btn-ghost" style="margin-top:8px"
            onclick="meshVerteiltStop()">■ Verteiltes Modell beenden</button>
  </div>`;
}

async function meshVerteiltStart() {
  const feld = $("#vtModell");
  const modell = feld ? feld.value.trim() : (state.vtModell||"");
  const ziel = $("#vtLauf");
  if (ziel) ziel.innerHTML = `<p style="color:var(--text-3);font-size:13px">
    Starte … das kann bei einem großen Modell eine Weile dauern: Jede Schicht
    muss über das Netz zu ihrem Gerät.</p>`;
  try {
    await apiPost("/api/mesh/verteilt/start", {modell: modell});
  } catch(e) {
    if (ziel) ziel.innerHTML = `<div class="warn-box">${esc(e.message)}</div>`;
    return;
  }
  renderMesh();
  // Ohne das stand das verteilte Modell (27.09.2026, Windows-PC) erst nach
  // Neuladen der Seite in der Modellwahl des Chats.
  await modelleNeuLaden();
  toast("Verteiltes Modell läuft — im Chat unter „Verteiltes Modell“ wählbar 🧩");
}

async function meshVerteiltStop() {
  try { await apiPost("/api/mesh/verteilt/stop", {}); } catch(e) {}
  renderMesh();
  modelleNeuLaden();
}

async function meshRpc(an) {
  try {
    /* Port 50052 ist der von llama.cpp voreingestellte. Aus ist 0. */
    await apiPost("/api/mesh/rpc", {port: an ? 50052 : 0});
    renderMesh();
  } catch(e) { alert("Ging nicht: " + e.message); renderMesh(); }
}

async function meshVerteiltPlan() {
  const feld = $("#vtModell");
  state.vtModell = feld ? feld.value.trim() : "";
  const ziel = $("#vtPlan");
  if (ziel) ziel.innerHTML = `<p style="color:var(--text-3);font-size:13px">Rechne…</p>`;
  try {
    state.vtPlan = await api("/api/mesh/verteilt?modell=" + encodeURIComponent(state.vtModell));
  } catch(e) {
    state.vtPlan = null;
    if (ziel) ziel.innerHTML = `<p class="warn-box">${esc(e.message)}</p>`;
    return;
  }
  if (ziel) ziel.innerHTML = meshPlanHtml(state.vtPlan);
}

async function renderMesh() {
  let m = {};
  try { m = await api("/api/mesh"); } catch(e) { m = {verfuegbar:false, fehler:e.message}; }
  clearInterval(meshTakt);

  if (!m.verfuegbar) {
    $("#view").innerHTML = `<div class="view-pad">
      <div class="view-head"><div class="vh-ico">🕸</div>
        <div><h1>Netzwerk</h1><p>Der dezentrale Unterbau ist in diesem Ordner nicht vorhanden.</p></div></div>
      <div class="warn-box">${esc(m.fehler||"mesh/ fehlt")}</div></div>`;
    return;
  }

  /* Nicht gestartet: die Wahl der Betriebsart ist der erste Schritt, und

            <b>🤿 Diving Net — dein eigenes Netz</b>

            <b>🌍 Weite — das offene Netz</b>
            <span>Wächst mit fremden Knoten. Mehr Compute, dafür Fremde im Netz.</span></button>
        </div>
        <div class="field" style="max-width:280px;margin-top:14px">
          <label>Höchstens abgeben (GB, leer = automatisch)</label>
          <input id="mesh-gb" type="number" min="1" max="512" placeholder="automatisch"></div>
        <p style="color:var(--text-3);font-size:12.5px;margin-top:8px">Dive on Wide gibt nie mehr ab, als dein Gerät gerade entbehren kann, und nimmt sofort zurück, sobald du den Speicher brauchst.</p>
      </div>
      <div class="mesh-kachel">
        <h3 style="margin-bottom:8px">Vor dem Start</h3>
        <div class="cu-check">

      </div></div>`;

      <div class="vh-actions">
